.hbtn{width:100%;font-size:11.5px;padding:5px 6px;margin-top:2px}
.hbtn.on{background:var(--acc);color:var(--accfg)}
#fmenu{position:fixed;left:0;top:0;z-index:20;width:clamp(150px,22vw,210px);max-height:calc(100dvh - 12px);overflow:auto;background:var(--panel);border:1px solid var(--acc);border-radius:9px;padding:4px;display:grid;gap:2px;box-shadow:0 6px 20px var(--shadow)}
#fmenu .t b{font-size:13px;line-height:1.2}

#fmenu button.a{text-align:left;font-size:12px;padding:6px 8px;border-color:transparent;background:transparent}#fmenu button.a:not(:disabled):hover{background:var(--acc);color:var(--accfg)}
#fmenu .why{font-size:10.5px;color:var(--mut);margin-top:-2px;line-height:1.2}
#tbar{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--acc);color:var(--accfg);padding:6px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px var(--shadow)}
#tbar button{background:var(--accfg);color:var(--acc);border-color:transparent;padding:3px 10px}
.slk{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;width:42%;aspect-ratio:1;display:grid;place-items:center;pointer-events:none;color:#ffd54a;filter:drop-shadow(0 0 4px #ffb300) drop-shadow(0 0 10px #ff9d00);animation:slk 1s ease-in-out infinite}
.slk .ic{width:100%;height:100%}
@keyframes slk{0%,100%{opacity:.25}50%{opacity:1}}
/* mesa 3D */
#m3{position:fixed;inset:0;z-index:0;display:none;touch-action:none;width:100vw;height:100dvh}

body.m3 #lcol,body.m3 #phs,body.m3 #rside{position:relative;z-index:6}

.card .ds .lbsp{float:right;width:0;height:calc(100% - 11cqw)}.card .ds .lb{float:right;clear:right;margin:.6cqw -.8cqw 0 1.2cqw}

.card .art{flex:none;width:68cqw;height:68cqw;border-radius:.8cqw;overflow:hidden;background:#0004;box-shadow:0 0 0 .55cqw #000a,0 0 0 1cqw #fff6}
.card .art svg{width:100%;height:100%;display:block}

.card .ds .ty{display:block;font:700 4.3cqw/1.25 'Merriweather',Georgia,'Times New Roman',serif;color:#ffe2a6;text-decoration:underline;text-decoration-thickness:.35cqw;text-underline-offset:.7cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.8cqw}

.card .up{color:#9fd4ff}.card .dn{color:#ff9a8f}

.slot.s .card .ds,.slot.s .card .st,.slot.s .card .sd{display:none}.slot.s .card .hd{padding-left:12cqw}.slot.s .card .fb{width:11cqw;height:11cqw;left:.6cqw;top:.75cqw}.slot.s .card .mid{top:17cqw;height:auto}.slot.s .card .art{width:94cqw;height:94cqw}

.fst{position:absolute;left:-4%;right:-4%;bottom:2%;z-index:3;display:flex;justify-content:center;align-items:center;gap:.25em;pointer-events:none;opacity:0;transition:opacity .25s;font-weight:700;font-size:max(10px,calc(var(--u)/4.8));line-height:1;white-space:nowrap;color:#fff;font-variant-numeric:tabular-nums}
.fst .ic{width:1em;height:1em;flex:none}
.fst.a{color:#ffd27a;text-shadow:0 0 3px #ff9d2e,0 0 9px #ff7a00,0 0 16px #ff7a0099,0 1px 1px #000}
.fst.d{color:#a9e0ff;text-shadow:0 0 3px #3aa4ff,0 0 9px #1f86ff,0 0 16px #1f86ff99,0 1px 1px #000}
.fst.up{color:#c9f7ff}.fst.dn{color:#ffb0a6}
.fst i{font-style:normal;font-size:.72em;margin-left:.15em}
body.phb .fst{opacity:1;animation:fbob 1.5s ease-in-out infinite alternate}
.fst.fl{animation:fflash 1.9s ease-out both}
@keyframes fbob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes fflash{0%{opacity:0;transform:translateY(4px) scale(.8)}12%{opacity:1;transform:translateY(0) scale(1.18)}65%{opacity:1;transform:translateY(-4px) scale(1)}100%{opacity:0;transform:translateY(-12px) scale(1)}}
#fx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
#fx .fxnum{position:fixed;font-weight:800;font-size:clamp(15px,3.4dvh,26px);text-shadow:0 1px 4px #000d,0 0 2px #000;white-space:nowrap;color:#fff}
#fx .fxnum.sm{font-size:clamp(11px,2.4dvh,16px)}
#fx .up{color:#7cc0ff}#fx .dn{color:#ff8579}#fx .dmg{color:#ff5a4d;font-size:clamp(18px,4.4dvh,32px)}#fx .heal{color:#6fe08a}#fx .xp{color:#ffd54a}
#fx .fxring{position:fixed;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px currentColor}
#fx .fxspark{position:fixed;width:7px;height:7px;border-radius:2px}
#fx .fxarrow{position:fixed;inset:0;filter:drop-shadow(0 0 5px #000a)}
#fx .fxfly{position:fixed}
#fx .fxbanner{position:fixed;left:0;right:0;top:50%;text-align:center;color:#fff;padding:9px 12px;background:linear-gradient(90deg,transparent,#000c 16%,#000c 84%,transparent)}
#fx .fxbanner b{display:block;font-size:clamp(20px,6dvh,38px);letter-spacing:.04em}
#fx .fxbanner small{display:block;font-size:clamp(11px,2.6dvh,15px);opacity:.85}
#fx .fxpop{position:fixed;left:50%;top:50%;--cw:min(150px,30dvh);filter:drop-shadow(0 6px 18px #000a)}

.card .art img.pic{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
textarea{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;-webkit-user-select:text;user-select:text;resize:vertical}
.fileb{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--panel)}
.cmsg{font-size:12px;border-radius:8px;padding:6px 8px;background:var(--slot)}.cmsg ul{margin:3px 0 0;padding-left:18px}.cmsg.bad{color:#b3261e}.cmsg.good{color:#1e7a3a}
@media(prefers-color-scheme:dark){.cmsg.bad{color:#ff8579}.cmsg.good{color:#7ddc97}}
/* modales */
[hidden]{display:none!important}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.mbox{background:var(--panel);color:var(--ink);border-radius:12px;padding:14px;width:min(780px,100%);max-height:92dvh;overflow:auto;display:grid;gap:10px;-webkit-user-select:text;user-select:text}
.mbox h3{font-size:16px}
.mbox p{margin:0}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pkgrid{--cw:64px;display:flex;flex-wrap:wrap;gap:8px}
.pk{display:grid;gap:3px;text-align:center;border-radius:8px;padding:4px;border:2px solid transparent;cursor:pointer}
.pk.on{border-color:var(--acc);background:var(--slot)}
.pk small{font-size:11px;color:var(--mut)}
.dtl{display:flex;gap:14px;align-items:flex-start}
.dtl .big{--cw:min(230px,36dvh);flex:none}
.dtl .big .card{cursor:default}
.dtl .det{display:grid;gap:4px;font-size:13px}
.rtxt{font-size:13px;line-height:1.5}
.rtxt h4{margin:8px 0 2px;font-size:13.5px;color:var(--acc)}
.rtxt ul{margin:2px 0;padding-left:18px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.ci{display:flex;gap:10px;--cw:70px;background:var(--slot);border-radius:8px;padding:8px}
.ci .card{cursor:default}
.ci div{font-size:12px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.gr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--slot);padding:6px;border-radius:8px}
.gr .card{cursor:default}
.gl{display:flex;gap:10px;align-items:center;--cw:56px}
.gl small{display:block}
.logl{display:grid;gap:2px;font-size:12.5px}
.logl .h{color:var(--acc);font-weight:700;margin-top:4px}
#rot{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rot svg{width:84px;height:84px;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:rt 2.4s ease-in-out infinite}
@keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait){#rot{display:flex}}
@media(prefers-reduced-motion:reduce){#rot svg{animation:none}}

/* cartas */
.card{width:var(--cw);height:calc(var(--cw)*4/3);font-size:max(5px,calc(var(--cw)/7));border-radius:calc(var(--cw)*.045);background:var(--frm) 0 0/100% 100%,linear-gradient(160deg,var(--fc),var(--fc2));padding:0;color:#fff;position:relative;cursor:pointer;box-shadow:0 1px 3px var(--shadow);flex:none;overflow:hidden;container-type:inline-size;font-family:'Merriweather',Georgia,'Times New Roman',serif}
.card:not(.back)>*{position:absolute}
.card .hd{left:3cqw;right:3cqw;top:3cqw;height:12.5cqw;display:flex;align-items:center;gap:1.6cqw;padding:0 2cqw 0 16.5cqw;background:linear-gradient(180deg,#000b,#0007);border-radius:1.8cqw;box-shadow:inset 0 0 0 .45cqw #fff3,0 .4cqw .8cqw #0006}
.card .fb{position:absolute;left:-.6cqw;top:-.6cqw;width:16cqw;height:16cqw;border-radius:50%;display:grid;place-items:center;background:var(--fac,var(--fc));border:.8cqw solid #fffe;box-shadow:0 .5cqw 1.4cqw #000c;z-index:2}
.card .fb svg{width:62%;height:62%;fill:#fff;filter:drop-shadow(0 .3cqw .3cqw #0007)}.card .fb.t{background:radial-gradient(circle at 40% 35%,#ffffff44,#0008)}.card .fb.t svg{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .nm{flex:1;min-width:0;font-size:var(--nf,6cqw);font-weight:700;line-height:1.15;text-transform:capitalize;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;text-shadow:0 .35cqw 0 #000,0 0 1.2cqw #000}
.card .ds .lbsp{float:right;width:0;height:calc(100% - 11cqw)}.card .ds .lb{float:right;clear:right;margin:.6cqw -.8cqw 0 1.2cqw}

/* ---- texto ---- */
const T_SUJ={esteMonstruo:'este monstruo',monstruoMio:'un monstruo tuyo',todosMisMonstruos:'todos tus monstruos',monstruoRival:'un monstruo rival',monstruoCampo:'un monstruo del campo',cartaCampoRival:'una carta del campo rival',cartaARRival:'una Acción o Reacción del rival en el campo (o su carta de campo)',monstruoRivalDef:'un monstruo rival en posición de defensa',reaccionRival:'una Reacción colocada boca abajo del rival',accionPermRival:'una Acción de equipo o continua del rival',atacante:'el atacante',yo:'tú',jugadorRival:'el rival'};
const T_DUR={finDelTurno:' hasta el final del turno',proxTurno:' hasta tu próximo turno',finProxTurno:' hasta el final de tu próximo turno'};
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
function ventTxt(vs){const riv=[],own=[];vs.forEach(v=>{if(v==='ataque')riv.push('ataca');else if(v==='invocacion')riv.push('invoca');else if(v==='finTurno')riv.push('termina su turno');else if(v==='dano')own.push('recibes daño')});
 const j=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' o '+a[a.length-1];
 const parts=[];if(riv.length)parts.push('el rival '+j(riv));if(own.length)parts.push(own[0]);return'Cuando '+parts.join(', o cuando ')}
function condTxt(c){if(!c)return'';switch(c.tipo){case'nivelMin':return`si su Nivel es ${c.n} o más`;case'aliadosMin':return`si controlas ${c.n} o más monstruos de su facción`;case'rivalTieneMas':return'si el rival controla más monstruos que tú';case'lpMax':return`si tienes ${c.n} LP o menos`;case'posicionVictima':return c.pos==='def'?'si el monstruo destruido estaba en defensa':'si el monstruo destruido estaba en ataque';case'manoMin':return`si tienes ${c.n} o más cartas en la mano`;case'equipado':return'si tiene un equipo'}return''}
function accTxt(e){const a=e.accion,o=e.objetivo,S=T_SUJ[o]||'';const st=a.stat==='def'?'DEF':'ATK';switch(a.tipo){
 case'robar':return`robas ${a.n} carta${a.n>1?'s':''}`;
 case'cambiarStat':{const pl=o==='todosMisMonstruos',g=a.valor<0?(pl?'pierden':'pierde'):(pl?'ganan':'gana');if(a.porNivel){const k=Math.abs(a.valor);return`${S} ${g} ${st} igual a ${k===1?(pl?'su propio Nivel':'su Nivel'):k+' veces '+(pl?'su propio Nivel':'su Nivel')}`}return`${S} ${g} ${a.valor<0?Math.abs(a.valor):'+'+a.valor} ${st}`}
 case'sinergiaStat':return`+${a.por} ${st} por cada otro monstruo de tu facción en tu campo (máx. +${a.max})`;
 case'infligirDano':return o==='yo'?`pierdes ${a.n} LP`:`el rival pierde ${a.n} LP`;
 case'curar':return o==='yo'?`recuperas ${a.n} LP`:`el rival recupera ${a.n} LP`;
 case'ganarXp':return`ganas ${a.n} XP (hasta el tope actual)`;
 case'destruir':return o==='atacante'?'destruyes al atacante':`destruyes ${S}`;
 case'devolverMano':return`devuelves ${S} a la mano de su dueño`;
 case'cambiarPosicion':return o==='atacante'?'el atacante pasa a posición de defensa y su ataque se detiene':o==='todosMisMonstruos'?'cambias la posición de todos tus monstruos':`cambias la posición de ${S}`;
 case'negarAtaque':return'niegas el ataque actual';
 case'fijarNivel0':return`${S} tiene Nivel 0`;
 case'nivelExtra':return`aprende rápido: gana +${a.n} de Nivel extra por batalla`;
 case'mitadDano':return'el daño de batalla que recibes se reduce a la mitad';
 case'pasarSobrante':return'el daño sobrante pasa al rival';
 case'descartarAzar':return o==='yo'?`descartas ${a.n} carta${a.n>1?'s':''} al azar de tu mano`:`el rival descarta ${a.n} carta${a.n>1?'s':''} al azar de su mano`;
 case'recuperar':return`devuelves ${a.n} carta${a.n>1?'s':''} de tu cementerio a tu mano`;
 case'moler':return o==='yo'?`envías ${a.n} carta${a.n>1?'s':''} de arriba de tu mazo al cementerio`:`el rival envía ${a.n} carta${a.n>1?'s':''} de arriba de su mazo al cementerio`;
 case'devolverMazo':return`devuelves ${S} al mazo de su dueño, que se mezcla`;
 case'equipoProteccion':return`${S} queda protegido: si fuera a ser destruido en batalla, se destruye esta carta en su lugar`+(a.valor?`. Además, mientras esté equipada, todos tus monstruos de la facción del equipado ganan +${a.valor} ATK`:'');
 case'equipoPerforar':return`${S} ${a.valor?'gana +'+a.valor+' ATK y ':''}perfora: cuando ataca a un monstruo en defensa con DEF menor que su ATK, el rival pierde LP igual a la diferencia`;
 case'equipoMaximizar':return`${S} gana +${a.valor} ATK y su DEF pasa a 0; si es destruido, pierdes 500 LP`;
 case'equipoSabiduria':return`${S} sube su Nivel a su tope, y vuelve a subirlo al empezar cada uno de tus turnos`;
 case'topeExtra':return`el tope de Nivel de ${S} sube +${a.valor}`;
 case'teletransportar':return`${S} vuelve a tu mazo y añades a tu mano un monstruo de tu mazo con sus mismas estrellas`;
 case'buscarMazo':return`si controlas un monstruo de su facción de ${a.tope/100}★ o menos, añades a tu mano hasta ${a.n} monstruo${a.n>1?'s':''} de su facción de ${a.tope/100}★ o menos desde tu mazo`;
 case'invocacionExtra':return'puedes invocar otro monstruo de su facción desde tu mano (invocación extra, hasta 3 por turno)'}return''}
/* conCosto: los monstruos muestran su costo en el texto; las Acciones y Reacciones lo muestran aparte */
function textoEfecto(e,conCosto){if(!e)return'';const D=e.disparador||{},t=D.tipo;
 if(t==='alDestruirEnBatalla'&&e.accion&&e.accion.tipo==='pasarSobrante'&&e.condicion&&e.condicion.tipo==='posicionVictima'&&e.condicion.pos==='def'&&!(e.alternativas&&e.alternativas.length))return'Perforación: cuando ataca a un monstruo en defensa con DEF menor que su ATK, el rival pierde LP igual a la diferencia.'+(e.limite==='unaVezTurno'?' (1 vez por turno)':e.limite==='unaVezDuelo'?' (1 vez por duelo)':'');
 let pre='';if(t==='alInvocar')pre='Al ser invocado';else if(t==='alAtacar')pre='Cuando ataca';else if(t==='alSerAtacado')pre='Cuando es atacado';else if(t==='alDestruirEnBatalla')pre=e.condicion&&e.condicion.tipo==='posicionVictima'?(e.condicion.pos==='def'?'Si destruye un monstruo en defensa':'Si destruye un monstruo en ataque'):'Si destruye un monstruo en batalla';else if(t==='alRecibirDano')pre='Cuando recibes daño';else if(t==='finMiTurno')pre='Al final de tu turno';else if(t==='ventana')pre=ventTxt(D.ventanas||[]);
 const lim=e.limite;if(lim==='unaVezTurno')pre=(pre?pre+', ':'')+'1 vez por turno';else if(lim==='unaVezDuelo')pre=(pre?pre+', ':'')+'1 vez por duelo';
 const cond=t==='alDestruirEnBatalla'&&e.condicion&&e.condicion.tipo==='posicionVictima'?'':condTxt(e.condicion);
 let cost='';if(conCosto&&e.costo&&e.costo.tipo==='gastarNivel')cost=`gasta ${e.costo.n} de su Nivel y `;
 const alts=e.alternativas&&e.alternativas.length?e.alternativas.map(x=>accTxt({...e,...x})):null;
 let body=alts?'elige una: '+alts.join('; o '):accTxt(e);
 if(DUR_LIM.includes(lim))body+=T_DUR[lim];
 body=(cost+body).trim();if(cond)body=cond+', '+body;
 const out=(pre?cap1(pre)+': '+body:cap1(body))+'.';return e.costo&&COSTO_RIESGO.includes(e.costo.tipo)?'Costo: '+costoRiesgoTxt(e.costo)+'. '+out:out}
const costoCarta=c=>!c||c.tipo==='ninguno'?null:c.tipo==='lp'?{t:'lp',v:c.n}:c.tipo==='xp'?{t:'xp',v:c.n}:c.tipo==='descartar'?{t:'disc',v:c.n}:c.tipo==='gastarNivel'?{t:'lvl',v:c.n}:{t:c.tipo,v:c.tipo==='molerPropio'?Math.max(1,c.n):0};

/* ---- compilar: sanea un efecto del JSON; devuelve null si no se puede usar ---- */
const _int=(v,a,b,d)=>{v=+v;return Number.isFinite(v)?Math.min(b,Math.max(a,Math.round(v))):d};
function compilarEfecto(x){
 if(!x||typeof x!=='object')return null;
 const D=x.disparador;if(!D||!V_TRIG[D.tipo])return null;
 const dsp={tipo:D.tipo};if(D.tipo==='ventana')dsp.ventanas=(Array.isArray(D.ventanas)?D.ventanas:[]).filter(v=>VENT[v]);
 const A=x.accion;if(!A||!V_ACC[A.tipo])return null;
 const ac={tipo:A.tipo};V_ACC[A.tipo].p.forEach(([k,,def,max])=>{ac[k]=_int(A[k],0,max,def)});
 if(A.tipo==='cambiarStat'||A.tipo==='sinergiaStat')ac.stat=A.stat==='def'?'def':'atk';
 if(A.tipo==='cambiarStat'){ac.valor=_int(A.valor,-3000,3000,0);if(A.porNivel)ac.porNivel=true}
 const C=x.costo||{tipo:'ninguno',n:0};const co={tipo:V_COSTO[C.tipo]?C.tipo:'ninguno',n:_int(C.n,0,5000,0)};
 let cd=null;if(x.condicion&&V_COND[x.condicion.tipo]){cd={tipo:x.condicion.tipo};V_COND[x.condicion.tipo].p.forEach(k=>{cd[k]=k==='pos'?(x.condicion.pos==='atk'?'atk':'def'):_int(x.condicion[k],0,9999,0)})}
 const e={disparador:dsp,condicion:cd,costo:co,objetivo:V_OBJ[x.objetivo]?x.objetivo:'yo',accion:ac,limite:LIM_ES[x.limite]?x.limite:'ninguno'};
 if(Array.isArray(x.alternativas)&&x.alternativas.length){e.alternativas=x.alternativas.slice(0,4).map(a=>{const r={etiqueta:String(a.etiqueta||'Opción').slice(0,40)};
  if(a.objetivo&&V_OBJ[a.objetivo])r.objetivo=a.objetivo;if(a.accion){const c=compilarEfecto({...x,alternativas:undefined,accion:a.accion});if(c)r.accion=c.accion}return r})}
 return e}

/* ---- validación de un efecto (ya compilado o crudo): devuelve [{lvl,msg}] ---- */
function validarEfecto(x,esMonstruo,perm){
 const I=[],E=m=>I.push({lvl:'e',msg:m}),W=m=>I.push({lvl:'w',msg:m});
 if(!x||typeof x!=='object'){E('El efecto no es un objeto.');return I}
 if(!x.disparador||!V_TRIG[x.disparador.tipo]){E('Disparador desconocido.');return I}
 if(!x.accion||!V_ACC[x.accion.tipo]){E('Acción desconocida.');return I}
 const T=V_TRIG[x.disparador.tipo],A=V_ACC[x.accion.tipo];
 if(esMonstruo&&!T.mon)E(`El disparador "${T.n}" es solo para Acciones y Reacciones.`);
 if(!esMonstruo&&!T.carta)E(`El disparador "${T.n}" es solo para monstruos.`);
 if(x.disparador.tipo==='ventana'&&!(x.disparador.ventanas||[]).filter(v=>VENT[v]).length)E('Elige al menos una ventana del rival.');
 const alts=Array.isArray(x.alternativas)&&x.alternativas.length?x.alternativas.map(a=>({...x,...a,accion:a.accion?{...x.accion,...a.accion}:x.accion})):[x];
 alts.forEach(f=>{const a=V_ACC[f.accion&&f.accion.tipo];if(!a){E('Una alternativa tiene acción desconocida.');return}
  if(!V_OBJ[f.objetivo])E('Objetivo desconocido.');
  else if(!a.ob.includes(f.objetivo))E(`"${a.n}" no puede apuntar a "${V_OBJ[f.objetivo]}".`);
  if(f.objetivo==='atacante'){const d=x.disparador;if(!(d.tipo==='alAtacar'||d.tipo==='alSerAtacado'||(d.tipo==='ventana'&&(d.ventanas||[]).length&&d.ventanas.every(v=>v==='ataque'))))E('"El atacante" solo existe cuando el disparador es un ataque.')}
  if(f.objetivo==='esteMonstruo'&&!esMonstruo)E('"Este monstruo" no existe en una Acción o Reacción.');
  if(f.accion.tipo==='pasarSobrante'&&x.disparador.tipo!=='alDestruirEnBatalla')E('"Pasar daño sobrante" necesita el disparador "Al destruir en batalla".')});
 if(A.cont&&perm!=='continua')E(`"${A.n}" solo sirve en una Acción continua.`);
 if(A.carta&&esMonstruo)E(`"${A.n}" solo sirve en Acciones y Reacciones.`);
 if(A.mon&&!esMonstruo)E(`"${A.n}" solo sirve en monstruos.`);
 if(A.eq&&perm!=='equipo')E(`"${A.n}" solo sirve en una Acción de equipo.`);
 if(A.dur&&!perm&&!DUR_LIM.includes(x.limite))E(`"${A.n}" necesita una duración (hasta el final del turno o hasta tu próximo turno).`);
 if(perm&&DUR_LIM.includes(x.limite))E('Una carta permanente no lleva duración: su bono dura mientras siga en la zona.');
 if(!A.dur&&DUR_LIM.includes(x.limite))E('La duración solo sirve para acciones que cambian estadísticas.');
 if(x.disparador.tipo==='continuo'&&x.limite!=='mientrasCampo')E('Un efecto continuo debe tener el límite "mientras esté en el campo".');
 if(x.limite==='mientrasCampo'&&x.disparador.tipo!=='continuo')E('"Mientras esté en el campo" solo sirve con el disparador continuo.');
 if(A.pas&&x.disparador.tipo!=='continuo')E(`"${A.n}" es una acción pasiva: usa el disparador continuo.`);
 if(!A.pas&&x.disparador.tipo==='continuo')E('Un efecto continuo solo admite acciones pasivas.');
 if(x.costo&&x.costo.tipo==='gastarNivel'&&!esMonstruo)E('"Gastar Nivel" solo sirve en monstruos.');
 if(x.costo&&COSTO_RIESGO.includes(x.costo.tipo)){
  if(esMonstruo)E('Ese costo es solo para Acciones y Reacciones.');
  if(x.costo.tipo==='nivel0'&&x.objetivo!=='monstruoMio')E('"Bajar a 0 el Nivel" necesita que el objetivo sea "un monstruo mío" (el que elegís paga el costo).');
  if(x.costo.tipo==='molerPropio'&&!(Number.isInteger(x.costo.n)&&x.costo.n>=1&&x.costo.n<=5))E('Las cartas del mazo deben ser de 1 a 5.');
  if(x.costo.tipo==='sinCartas'&&x.disparador.tipo==='ventana')W('Una Reacción se activa en el turno rival: "no jugar más cartas este turno" casi no cuesta nada ahí.')}
 const pr=[...(x.alternativas||[]).map(a=>a.accion).filter(Boolean),x.accion];
 pr.forEach(p=>{const d=V_ACC[p.tipo];if(d)d.p.forEach(([k,l,,mx])=>{if(p[k]===undefined&&d.eq)return;if(!Number.isInteger(p[k])||p[k]<0||p[k]>mx)E(`"${l}" debe ser un entero entre 0 y ${mx}.`)})});
 return I}

const PRESETS=[
 {k:'robar',n:'Robar una carta al invocarlo',p:[],build:()=>({disparador:{tipo:'alInvocar'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'yo',accion:{tipo:'robar',n:1},limite:'ninguno'})},
 {k:'sinergiaAtaque',n:'+ATK por cada aliado de la facción',p:[['por','ATK por aliado',200],['max','Máximo total',600]],build:v=>({disparador:{tipo:'continuo'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'esteMonstruo',accion:{tipo:'sinergiaStat',stat:'atk',por:v.por,max:v.max},limite:'mientrasCampo'})},
 {k:'sinergiaDefensa',n:'+DEF por cada aliado de la facción',p:[['por','DEF por aliado',200],['max','Máximo total',600]],build:v=>({disparador:{tipo:'continuo'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'esteMonstruo',accion:{tipo:'sinergiaStat',stat:'def',por:v.por,max:v.max},limite:'mientrasCampo'})},

 {k:'desgaste',n:'Desgaste: daño al final de tu turno',p:[['n','LP por turno',100]],build:v=>({disparador:{tipo:'finMiTurno'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'jugadorRival',accion:{tipo:'infligirDano',n:v.n},limite:'ninguno'})},
 {k:'curar',n:'Curar gastando Nivel',p:[['costo','Nivel que gasta',300],['n','LP que recuperas',500]],build:v=>({disparador:{tipo:'manual'},condicion:null,costo:{tipo:'gastarNivel',n:v.costo},objetivo:'yo',accion:{tipo:'curar',n:v.n},limite:'unaVezTurno'})},
 {k:'ejecucion',n:'Ejecución: daño al destruir en batalla',p:[['n','LP que pierde el rival',300]],build:v=>({disparador:{tipo:'alDestruirEnBatalla'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'jugadorRival',accion:{tipo:'infligirDano',n:v.n},limite:'ninguno'})},
 {k:'aprendizajeRapido',n:'Aprendizaje rápido (+100 de Nivel por batalla)',p:[],build:()=>({disparador:{tipo:'continuo'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'esteMonstruo',accion:{tipo:'nivelExtra',n:100},limite:'mientrasCampo'})},
 {k:'perforar',n:'Perforación (daño a través de la defensa)',p:[],build:()=>({disparador:{tipo:'alDestruirEnBatalla'},condicion:{tipo:'posicionVictima',pos:'def'},costo:{tipo:'ninguno',n:0},objetivo:'jugadorRival',accion:{tipo:'pasarSobrante'},limite:'ninguno'})},
 {k:'mitadDano',n:'Reduce a la mitad el daño que recibes',p:[],build:()=>({disparador:{tipo:'continuo'},condicion:null,costo:{tipo:'ninguno',n:0},objetivo:'yo',accion:{tipo:'mitadDano'},limite:'mientrasCampo'})}];
const presetBuild=(k,v)=>{const p=PRESETS.find(x=>x.k===k);if(!p)return null;const o={};p.p.forEach(([c,,def])=>{o[c]=v&&v[c]!==undefined&&v[c]!==''?+v[c]:def});return compilarEfecto(p.build(o))};
/* a qué plantilla corresponde un efecto (con sus valores), o null si es personalizado */
function presetDe(e){if(!e)return null;const c=compilarEfecto(e);if(!c)return null;
 for(const p of PRESETS){const v={};
  const a=c.accion;
  if(p.k==='sinergiaAtaque'||p.k==='sinergiaDefensa'){if(a.tipo==='sinergiaStat'){v.por=a.por;v.max=a.max}}
  else if(p.k==='reflejo'||p.k==='desgaste'||p.k==='ejecucion'){if(a.tipo==='infligirDano')v.n=a.n}
  else if(p.k==='curar'){if(a.tipo==='curar'){v.costo=c.costo.n;v.n=a.n}}
  const b=presetBuild(p.k,v);if(b&&JSON.stringify(b)===JSON.stringify(c))return{k:p.k,v}}
 return null}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(d,o)=>({uid:UID++,d,o,nivel:0,pos:'atk',boost:null,mods:[],st:-9,att:false,ub:false,uh:false,pc:false,ut:-1,ud:false,up:false,eq:null});
function resetC(c){c.nivel=0;c.pos='atk';c.boost=null;c.mods=[];c.st=-9;c.att=false;c.ub=false;c.uh=false;c.pc=false;c.ut=-1;c.up=false;c.eq=null;c.lt={}}
const isM=c=>c.d.kind!==undefined;
const cur=()=>G.pl[G.cur],opp=()=>G.pl[1-G.cur];
const xpCap=()=>CFG.xpCap0+CFG.xpCapStep*Math.floor((G.round-1)/2);
const effs=c=>c.d.efs||(c.d.ef?[c.d.ef]:[]);
const disp=(c,t)=>{for(const e of effs(c))if(e.disparador.tipo===t)return e;return null};
const pasiva=(c,a)=>{for(const e of effs(c))if(e.disparador.tipo==='continuo'&&e.accion.tipo===a)return e.accion;return null};
/* tope de Nivel actual: el impreso más el de Acciones continuas como "tope extra" */
function capOf(c){let v=c.d.cap;const pl=G&&c.o!=null?G.pl[c.o]:null;if(!pl||!pl.mons.includes(c))return v;
 for(const z of pl.zones){if(z&&z.up&&z.d.type==='A'&&z.d.perm==='cont'&&z.d.ef&&z.d.ef.accion.tipo==='topeExtra'&&(z.d.fi<0||z.d.fi===c.d.fi))v+=z.d.ef.accion.valor||0}return v}
const eN=c=>c.mods.some(m=>m.stat==='nivel0')?0:Math.min(c.nivel,capOf(c));
const allies=c=>G.pl[c.o].mons.filter(x=>x&&x!==c&&x.d.fac===c.d.fac);
function bonus(c,st){let v=0;const pl=G.pl[c.o];
 for(const z of pl.zones){if(!z||!z.up||!z.d.perm||z.d.type!=='A')continue;if(z.d.fi>=0&&z.d.fi!==c.d.fi)continue;const a=z.d.ef.accion;let add=0;if(a.tipo==='cambiarStat'&&a.stat===st)add=a.valor;else if(st==='atk'&&z.d.perm==='equip'&&(a.tipo==='equipoMaximizar'||a.tipo==='equipoPerforar'))add=a.valor||0;
  else if(st==='atk'&&z.d.perm==='equip'&&a.tipo==='equipoProteccion'&&a.valor){const t=z.eq!=null?byUid(z.eq):null;if(t&&pl.mons.includes(t)&&t.d.fi===c.d.fi)v+=a.valor;continue}if(!add)continue;
  if(z.d.perm==='equip'?z.eq===c.uid:true)v+=add}
 const f=G.field;if(f)for(const m of f.d.field.mods){if(m.stat!==st)continue;if(m.para==='todas'||(m.para==='faccion'?c.d.fi===f.d.fi:c.d.fi!==f.d.fi))v+=m.valor}
 return v}
function eATK(c){let v=c.d.at+bonus(c,'atk');if(c.boost==='atk')v+=eN(c);const s=pasiva(c,'sinergiaStat');if(s&&s.stat==='atk')v+=Math.min(s.max,s.por*allies(c).length);c.mods.forEach(m=>{if(m.stat==='atk')v+=m.amt});return Math.max(0,v)}
/* equipo especial colocado sobre este monstruo (protección, perforación, maximizar) */
const eqOn=(c,t)=>c&&c.o!=null&&G.pl[c.o]?G.pl[c.o].zones.find(z=>z&&z.up&&z.d.perm==='equip'&&z.eq===c.uid&&z.d.ef&&z.d.ef.accion.tipo===t):null;
function eDEF(c){if(eqOn(c,'equipoMaximizar'))return 0;let v=c.d.df+bonus(c,'def');if(c.boost==='def')v+=eN(c);const s=pasiva(c,'sinergiaStat');if(s&&s.stat==='def')v+=Math.min(s.max,s.por*allies(c).length);c.mods.forEach(m=>{if(m.stat==='def')v+=m.amt});return Math.max(0,v)}
const sacVal=m=>m.nivel>=CFG.vetNivel?CFG.vetValue:1;
const sacOK=(sel,n)=>{const s=sel.reduce((a,m)=>a+sacVal(m),0);return s>=n&&sel.every(m=>s-sacVal(m)<n)};
const val=c=>isM(c)?c.d.at+c.d.df*.6+c.d.sac*500:(c.d.type==='A'?1800:2000);
function log(t,h){G.log.push({t,h});if(G.log.length>120)G.log.shift()}
const byUid=u=>{for(const p of G.pl)for(const c of [...p.hand,...p.mons,...p.zones,...p.grave])if(c&&c.uid===u)return c;return G.field&&G.field.uid===u?G.field:null};
function expire(ph){G.pl.forEach(p=>[...p.mons,...p.zones].forEach(c=>{if(c)c.mods=c.mods.filter(m=>!(m.until.phase===ph&&m.until.turn<=G.turn))}))}

/* copias máximas que una carta admite en un mazo (lo define el Taller; una carta única admite 1) */
const maxCop=d=>d.efs&&d.efs.length>=3?1:Math.max(1,Math.min(3,d.copies||1));
/* mazo automático de una facción (IA y simulaciones): elige del material de la facción hasta 40 cartas, como haría un jugador */
function buildDeck(fi,o){const bag=L=>shuffle(L.flatMap(d=>Array(maxCop(d)).fill(d)));
 const mons=MONS.filter(d=>d.fi===fi||(d.fi>=0&&FAC[d.fi]&&FAC[d.fi].neu)),light=bag(mons.filter(d=>!d.sac)),heavy=bag(mons.filter(d=>d.sac)),sps=bag(SP.filter(d=>d.fi<0||d.fi===fi));
 const pick=[...light.slice(0,15),...heavy.slice(0,7)];if(pick.length<22)pick.push(...light.slice(15,15+22-pick.length));
 pick.push(...sps.slice(0,40-pick.length));return shuffle(pick.map(d=>mk(d,o)))}
function buildRec(cards,o){const a=[];cards.forEach(({d,n})=>{for(let i=0;i<n;i++)a.push(mk(d,o))});return shuffle(a)}
function startGame(f0,f1,sim,rec){
 if(!MONS.length)return Promise.resolve();GEN++;FX.clear();CH.clear();
 const mkp=(i,f,ai,name,rc)=>({i,name,ai,fi:f,lp:CFG.lp,xp:0,hand:[],deck:rc?buildRec(rc,i):buildDeck(f,i),grave:[],mons:Array(5).fill(null),zones:Array(3).fill(null),summoned:false});
 G={field:null,rec:sim?null:rec,pl:[mkp(0,f0,sim,sim?'IA A':'Tú',sim?null:rec),mkp(1,f1,true,sim?'IA B':'Rival')],turn:0,cur:0,first:Math.random()<.5?0:1,phase:'main',over:null,log:[],round:1,sim};
 G.pl.forEach(p=>{for(let i=0;i<CFG.hand0;i++)p.hand.push(p.deck.pop())});
 UI.sel=null;UI.speed=window.__fast?0:(sim?650:550);
 $('#menu').hidden=true;$('#game').hidden=false;if(typeof m3start==='function')m3start();
 Snd.moodReset();Snd.music('calm');UI.hand=true;FX.snd('shuffle');return act(async()=>{if(!sim&&!window.__fast)G.first=await rollFirst();log(`${G.pl[G.first].name} empieza.`,1);await beginTurn()});
}
function joinHand(p,c){p.hand.push(c);for(let i=p.hand.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p.hand[i],p.hand[j]]=[p.hand[j],p.hand[i]]}if(!p.ai){UI.shuf=Date.now();setTimeout(()=>FX.snd('shuffle'),260)}}
function draw(p,n,lose){for(let i=0;i<n;i++){if(!p.deck.length){if(lose&&!G.over)endGame(1-p.i,`${p.name} no tiene cartas para robar.`);return}joinHand(p,p.deck.pop())}}
function endGame(w,why){if(G.over)return;G.over={w,why};log(why,1);render();const p=G.pl[w];
 modal(`<h3>${w===-1?'Empate':(p.name+' gana el duelo')}</h3><p>${why}</p><div class="mbtns"><button class="pri" data-m="again">Revancha</button><button data-m="menu">Menú</button></div>`).then(v=>{if(v==='again')startGame(G.pl[0].fi,G.pl[1].fi,G.sim,G.rec);else toMenu()})}
async function beginTurn(){
 G.turn++;G.cur=(G.first+G.turn-1)%2;G.round=Math.ceil(G.turn/2);G.phase='main';
 expire('start');const p=cur();p.summoned=false;
 p.mons.forEach(m=>{if(m){m.boost=null;m.ub=false;m.uh=false;m.att=false;m.pc=false}});
 log(`Turno ${G.turn} · ${p.name}`,1);
 render();await FX.banner(`Turno ${G.turn} · ${p.name}`,'Fase principal');
 if(G.turn>1){await FX.draw(p);draw(p,1,true)}
 if(fieldRule('juegoSabio')){const b=p.xp;p.xp=Math.min(xpCap(),p.xp+100);if(p.xp>b){log(`Juego sabio: ${p.name} gana ${p.xp-b} XP.`);FX.hud(p.i,'+'+(p.xp-b)+' XP','xp',1)}}
 p.mons.forEach(m=>{if(m&&eqOn(m,'equipoSabiduria'))sabio(m)});
 render();
 if(!G.over&&p.ai)await aiTurn();
}
const PH={main:'Fase principal',battle:'Fase de batalla',end:'Fase final'};
async function goPhase(ph){if(G.over||G.phase===ph)return;G.phase=ph;log(PH[ph]+'.');render();await FX.banner(PH[ph],ph==='end'?'Juega Acciones o coloca Reacciones antes de ceder el turno':'')}
async function endTurn(){
 if(G.over)return;const p=cur(),o=opp();G.phase='end';render();
 for(const m of p.mons.filter(Boolean)){await fireMon(m,'finMiTurno',{});if(G.over)return}
 await react('endTurn',{});if(G.over)return;
 if(p.hand.length>CFG.handMax){const n=p.hand.length-CFG.handMax;let ch;
  if(p.ai)ch=[...p.hand].sort((a,b)=>val(a)-val(b)).slice(0,n);else ch=await pickCards(`Mano llena: descarta ${n} carta(s)`,p.hand,n,n,{nocancel:1});
  ch.forEach(x=>{p.hand.splice(p.hand.indexOf(x),1);p.grave.push(x)});log(`${p.name} descarta ${n} por límite de mano.`)}
 expire('end');render();await sleep(UI.speed/2);await beginTurn();
}
async function hurt(pi,amt,kind){
 if(G.over||amt<=0)return;const p=G.pl[pi];
 if(kind==='battle'&&p.mons.some(m=>m&&pasiva(m,'mitadDano')))amt=Math.floor(amt/2);
 p.lp=Math.max(0,p.lp-amt);log(`${p.name} pierde ${amt} LP.`);FX.hud(pi,'−'+amt,'dmg');
 if(p.lp<=0){endGame(1-pi,`${p.name} se quedó sin puntos de vida.`);return}
 for(const m of p.mons.filter(Boolean)){await fireMon(m,'alRecibirDano',{amt});if(G.over)return}
 if(pi!==G.cur)await react('damage',{amt});
}
const gainXP=p=>{const b=p.xp;p.xp=Math.min(xpCap(),p.xp+CFG.xpGain);if(p.xp>b)FX.hud(p.i,'+'+(p.xp-b)+' XP','xp',1)};
const gainNivel=c=>{const b=c.nivel;c.nivel=Math.min(capOf(c),c.nivel+c.d.speed);if(c.nivel>b)FX.mark(c,{k:'lv',amt:c.nivel-b})};
const snap=c=>({a:eATK(c),d:eDEF(c)});
function statFx(c,b){if(!FX.on())return;const a=snap(c);if(a.a!==b.a)FX.mark(c,{k:'stat',st:'atk',from:b.a,to:a.a});if(a.d!==b.d)FX.mark(c,{k:'stat',st:'def',from:b.d,to:a.d})}
function dropEq(c,p){p.zones.forEach((z,i)=>{if(z&&z.eq===c.uid){p.zones[i]=null;resetC(z);p.grave.push(z);log(`${z.d.name} se destruye junto a ${c.d.name}.`)}})}
/* "Sabiduría": el Nivel sube a su tope actual */
function sabio(m){const b=m.nivel,t=capOf(m);if(t>b){m.nivel=t;FX.mark(m,{k:'lv',amt:t-b});log(`${m.d.name} sube su Nivel a ${t}.`)}}
/* "Teletransportación": monstruos del mazo con las mismas estrellas */
const teleOpts=(p,m)=>p.deck.filter(x=>isM(x)&&x.d.cap===m.d.cap);
/* "llamado": monstruos chicos de la facción (en el mazo y en el campo) */
const llamFi=(src,p)=>src.d.fi>=0?src.d.fi:p.fi;
const llamDeck=(src,p,a)=>p.deck.filter(x=>isM(x)&&x.d.fi===llamFi(src,p)&&x.d.cap<=a.tope);
const llamOK=(src,p,a)=>p.mons.some(m=>m&&m.d.fi===llamFi(src,p)&&m.d.cap<=a.tope)&&llamDeck(src,p,a).length>0;
/* daño directo sin cadena (lo usa el costo de "Maximizar el ataque") */
function burn(pi,n,why){if(G.over)return;const p=G.pl[pi];p.lp=Math.max(0,p.lp-n);log(`${why}: ${p.name} pierde ${n} LP.`);FX.hud(pi,'−'+n,'dmg');if(p.lp<=0)endGame(1-pi,`${p.name} se quedó sin puntos de vida.`)}
/* destrucción en batalla: un "Equipo de protección" se destruye en su lugar */
function batKill(c){const z=eqOn(c,'equipoProteccion');if(z){log(`${z.d.name} se destruye en lugar de ${c.d.name}.`);destroy(z);FX.mark(c,{k:'pulse',label:'¡Protegido!'});return false}destroy(c);return true}
function destroy(c){FX.ghost(c,'boom');if(G.field===c){G.field=null;resetC(c);G.pl[c.o].grave.push(c);return}const p=G.pl[c.o],mx=eqOn(c,'equipoMaximizar');const i=p.mons.indexOf(c);if(i>=0)p.mons[i]=null;const z=p.zones.indexOf(c);if(z>=0)p.zones[z]=null;dropEq(c,p);resetC(c);p.grave.push(c);if(mx&&i>=0)burn(mx.o,500,mx.d.name)}
function toDeck(c){FX.ghost(c,'up');const p=G.pl[c.o];const i=p.mons.indexOf(c);if(i>=0)p.mons[i]=null;const z=p.zones.indexOf(c);if(z>=0)p.zones[z]=null;dropEq(c,p);resetC(c);p.deck.push(c);shuffle(p.deck);FX.snd('shuffle')}
function bounce(c){FX.ghost(c,'up');const p=G.pl[c.o];const i=p.mons.indexOf(c);if(i>=0)p.mons[i]=null;const z=p.zones.indexOf(c);if(z>=0)p.zones[z]=null;dropEq(c,p);resetC(c);joinHand(p,c)}
const inField=c=>G.pl[c.o].mons.includes(c);
const fieldRule=k=>!!(G&&G.field&&G.field.d.field&&(G.field.d.field.reglas||[]).includes(k));
/* "bloqueo de ataque inicial": recién invocado este turno */
const summonLocked=c=>fieldRule('sinAtaqueAlInvocar')&&c.st===G.turn;
/* sacrificios que pide un monstruo ahora (la "facilitación de tributo" descuenta 1 a pesados y tanques) */
const sacReq=c=>Math.max(0,c.d.sac-(c.d.sac>0&&fieldRule('sacrificioMenos')?1:0));
const canAttack=c=>inField(c)&&c.pos==='atk'&&!c.att&&G.turn>1&&!summonLocked(c);

/* costos */
const arLock=p=>p.lockAR===G.turn;
function canPay(p,c,ex){switch(c.t){case'lp':return p.lp>c.v;case'xp':return p.xp>=c.v;case'none':case'sinCartas':case'sinReacciones':case'nivel0':return true;
 case'defensa':return p.mons.some(m=>m&&m.pos==='atk');case'molerPropio':return p.deck.length>c.v;case'devolverMano':case'devolverMazo':return p.mons.some(Boolean)}
 return p.hand.filter(x=>x!==ex).length>=c.v}
async function payCost(p,c,ex,tgt){
 if(c.t==='none')return true;
 if(c.t==='sinCartas'){p.lockAR=G.turn;log(`${p.name} no podrá jugar más Acciones ni Reacciones este turno.`);return true}
 if(c.t==='sinReacciones'){p.noReactT=p.i===G.cur?G.turn+1:G.turn+2;log(`${p.name} no podrá activar Reacciones en el próximo turno rival.`);return true}
 if(c.t==='molerPropio'){let k=0;for(let i=0;i<c.v&&p.deck.length;i++){p.grave.push(p.deck.pop());k++}log(`${p.name} envía ${k} carta(s) de su mazo al cementerio.`);FX.snd('slide');render();return true}
 if(c.t==='nivel0'){if(tgt&&p.mons.includes(tgt)){tgt.nivel=0;log(`${tgt.d.name} baja su Nivel a 0.`)}return true}
 if(c.t==='defensa'){const L=p.mons.filter(m=>m&&m.pos==='atk');if(!L.length)return false;
  const m=p.ai?[...L].sort((a,b)=>(eDEF(b)-eATK(b))-(eDEF(a)-eATK(a)))[0]:(L.length===1?L[0]:await pickTarget('Costo: elige el monstruo que pasa a defensa',L));if(!m)return false;
  flip(m);m.pc=true;log(`${m.d.name} pasa a defensa para pagar el costo.`);render();return true}
 if(c.t==='devolverMano'||c.t==='devolverMazo'){const L=p.mons.filter(m=>m&&m!==tgt);if(!L.length)return false;
  const m=p.ai?[...L].sort((a,b)=>val(a)-val(b))[0]:await pickTarget(`Costo: elige el monstruo que vuelve ${c.t==='devolverMano'?'a tu mano':'a tu mazo'}`,L);if(!m)return false;
  log(`${m.d.name} vuelve ${c.t==='devolverMano'?'a la mano':'al mazo'} para pagar el costo.`);if(c.t==='devolverMano')bounce(m);else toDeck(m);render();return true}
 if(c.t==='lp'){p.lp-=c.v;log(`${p.name} paga ${c.v} LP.`);return true}
 if(c.t==='xp'){p.xp-=c.v;log(`${p.name} gasta ${c.v} XP.`);return true}
 const pool=p.hand.filter(x=>x!==ex);let ch;
 if(p.ai)ch=[...pool].sort((a,b)=>val(a)-val(b)).slice(0,c.v);
 else{ch=await pickCards(`Descarta ${c.v} carta(s) para pagar`,pool,c.v,c.v);if(!ch)return false}
 ch.forEach(x=>{p.hand.splice(p.hand.indexOf(x),1);p.grave.push(x)});log(`${p.name} descarta ${ch.length} carta(s).`);return true;
}

/* invocación */
function summonInfo(p,c,extra){
 if(G.phase!=='main')return{ok:false,why:'Solo en la fase principal.'};
 if(!extra&&p.summoned)return{ok:false,why:'Ya invocaste este turno.'};
 const n=sacReq(c);const neu=FAC[c.d.fi]&&FAC[c.d.fi].neu;const pool=p.mons.filter(m=>m&&(neu||m.d.fac===c.d.fac));
 if(n>0){const tot=pool.reduce((a,m)=>a+sacVal(m),0);if(tot<n)return{ok:false,why:`Necesita ${n} sacrificio(s) de ${FAC[c.d.fi].n} en tu campo (un veterano con Nivel ${CFG.vetNivel}+ vale ${CFG.vetValue}).`,pool}}
 else if(!p.mons.includes(null))return{ok:false,why:'Campo lleno.'};
 return{ok:true,pool};
}
function aiPickSacs(pool,n){const s=[...pool].sort((a,b)=>(a.nivel+a.d.at/10)-(b.nivel+b.d.at/10));const sel=[];let t=0;for(const m of s){if(t>=n)break;sel.push(m);t+=sacVal(m)}
 for(const m of [...sel])if(t-sacVal(m)>=n){sel.splice(sel.indexOf(m),1);t-=sacVal(m)}return sel}
async function doSummon(p,c,pos,presel,extra){
 const s=summonInfo(p,c,extra);if(!s.ok)return false;let sacs=[];
 const nq=sacReq(c);if(nq>0){
  if(presel)sacs=presel;else if(p.ai)sacs=aiPickSacs(s.pool,nq);
  else{sacs=await pickCards(`Sacrificios para invocar a ${c.d.name} (necesitas ${nq})`,s.pool,1,5,{valid:sel=>sacOK(sel,nq),info:sel=>`Valor ${sel.reduce((a,m)=>a+sacVal(m),0)} / ${nq}`,cap:m=>sacVal(m)>1?'vale 2':'vale 1'});if(!sacs)return false}
 }
 const from=FX.fromHand(p,c);
 sacs.forEach(m=>{m._sac=1;destroy(m)});if(sacs.length){render();await FX.settle()}
 p.hand.splice(p.hand.indexOf(c),1);const i=p.mons.indexOf(null);p.mons[i]=c;
 c.pos=pos;c.pc=true;c.st=G.turn;c.o=p.i;p.summoned=true;
 log(`${p.name} invoca a ${c.d.name} en ${pos==='atk'?'ataque':'defensa'}${sacs.length?` sacrificando a ${sacs.map(m=>m.d.name).join(', ')}`:''}.`);
 render();await FX.land(c,from);
 await fireMon(c,'alInvocar',{});
 await FX.settle();await react('summon',{card:c});return true;
}
async function doSet(p,c){if(arLock(p))return;const from=FX.fromHand(p,c);const i=p.zones.indexOf(null);p.hand.splice(p.hand.indexOf(c),1);p.zones[i]=c;c.o=p.i;log(`${p.name} coloca una carta boca abajo.`);render();await FX.land(c,from)}

/* ===== intérprete de efectos ===== */
const PICK=['monstruoMio','monstruoRival','monstruoCampo','cartaCampoRival','cartaARRival','monstruoRivalDef','reaccionRival','accionPermRival'];
const PICKMSG={monstruoMio:'Elige un monstruo tuyo',monstruoRival:'Elige un monstruo rival',monstruoCampo:'Elige un monstruo del campo',cartaCampoRival:'Elige una carta rival',cartaARRival:'Elige una Acción, Reacción o carta de campo del rival',monstruoRivalDef:'Elige un monstruo rival en defensa',reaccionRival:'Elige una Reacción colocada del rival',accionPermRival:'Elige una Acción permanente del rival'};
/* "solo si controlas un monstruo de la facción de la carta" */
const reqOK=(p,d)=>!d.reqF||p.mons.some(m=>m&&m.d.fi===d.fi);
/* Acciones y Reacciones del rival en el campo (boca arriba o abajo) y su carta de campo */
const arRival=rv=>[...rv.zones.filter(Boolean),...(G.field&&G.field.o===rv.i?[G.field]:[])];
const efAlt=(e,i)=>{const x=e.alternativas&&i!=null?e.alternativas[i]:null;return x?{...e,...x}:e};
const flip=m=>{const f=m.pos==='atk'?0:90;m.pos=m.pos==='atk'?'def':'atk';FX.mark(m,{k:'pos',from:f,to:90-f})};

const actTargets=(p,d)=>{if(!reqOK(p,d))return[];const e=d.ef;let L=e.alternativas?e.alternativas.flatMap((a,i)=>posibles(p,efAlt(e,i),null)):posibles(p,e,null);if(e.accion.tipo==='teletransportar')L=L.filter(m=>teleOpts(p,m).length);if(e.accion.tipo==='buscarMazo'&&!llamOK({d},p,e.accion))L=[];if(d.perm==='equip'&&d.fi>=0)L=L.filter(m=>m.d&&m.d.fi===d.fi);return L};
async function resolver(e,src,ap,ctx,prm){

   let ch;if(ap.ai)ch=pool.sort((x,y)=>val(y)-val(x)).slice(0,n);else ch=await pickCards(`Elige ${n} carta(s) de tu cementerio para volver a tu mano`,pool,n,n,{nocancel:1});
   (ch||[]).forEach(x=>{ap.grave.splice(ap.grave.indexOf(x),1);joinHand(ap,x)});log(`${ap.name} recupera ${(ch||[]).length} carta(s) del cementerio.`);render();break}

  case'devolverMazo':for(const x of cards()){log(`${nm(x)} vuelve al mazo de su dueño.`);if(ctx&&(x===ctx.attacker||x===ctx.card))ctx.cancelled=true;toDeck(x)}break;
  case'buscarMazo':{if(!llamOK(src,ap,a)){log('No se cumple la condición.');return false}const L=llamDeck(src,ap,a);const n=Math.min(a.n,L.length);let ch;
   if(ap.ai){const seen=new Set();ch=[...L].sort((x,y)=>val(y)-val(x)).filter(x=>seen.has(x.d.id)?false:(seen.add(x.d.id),true)).slice(0,n);if(ch.length<n)ch=ch.concat(L.filter(x=>!ch.includes(x)).slice(0,n-ch.length))}

  case'teletransportar':{if(!t||!inField(t))return false;const L=teleOpts(ap,t);if(!L.length){log('No hay en el mazo un monstruo con esas estrellas.');return false}

  case'invocacionExtra':{if(!ap.exS||ap.exS.t!==G.turn)ap.exS={t:G.turn,n:0};if(ap.exS.n>=3){log('La invocación extra ya se usó 3 veces este turno.');return false}

/* efecto de monstruo con disparador (alInvocar, alSerAtacado, alDestruirEnBatalla, finMiTurno) */

async function fireMon(src,trig,ctx){if(CH.has(src.uid))return false;

  if(e.limite==='unaVezTurno'&&src.lt[i]===G.turn)continue;if(e.limite==='unaVezDuelo'&&src.lt['d'+i])continue;

/* efecto manual de un monstruo (por ejemplo, curar gastando Nivel) */

/* acciones */
async function askParams(p,d){let e=d.ef,alt=null;
 if(e.alternativas){const ch=await choice(d.name,e.alternativas.map((a,i)=>[String(i),a.etiqueta]));if(ch==null)return null;alt=+ch;e=efAlt(e,alt)}
 const prm={alt};
 if(PICK.includes(e.objetivo)){const t=await pickTarget(PICKMSG[e.objetivo],posibles(p,e,null).filter(m=>!(d.perm==='equip'&&d.fi>=0&&m.d&&m.d.fi!==d.fi)&&(e.accion.tipo!=='teletransportar'||teleOpts(p,m).length)));if(!t)return null;prm.t=t}
 return prm}
async function playAction(p,c,prm){
 const d=c.d;if(arLock(p)||!reqOK(p,d))return false;if(!prm){prm=await askParams(p,d);if(!prm)return false}
 if(!canPay(p,d.cost,c))return false;
 if(d.perm&&!p.zones.includes(null))return false;
 if(!(await payCost(p,d.cost,c,prm.t)))return false;
 if(d.perm){const from=FX.fromHand(p,c);p.hand.splice(p.hand.indexOf(c),1);const i=p.zones.indexOf(null);p.zones[i]=c;c.o=p.i;c.up=true;
  if(d.perm==='equip'&&prm.t){FX.snd('equip');c.eq=prm.t.uid;log(`${p.name} equipa ${d.name} a ${prm.t.d.name}.`);if(d.ef.accion.tipo==='equipoSabiduria')sabio(prm.t)}else log(`${p.name} deja ${d.name} en su zona.`);
  const b=prm.t&&snap(prm.t);render();await FX.land(c,from);if(b)statFx(prm.t,b);render();await FX.settle();return true}
 p.hand.splice(p.hand.indexOf(c),1);p.grave.push(c);log(`${p.name} juega ${d.name}.`);render();await FX.pop(c);

async function playField(p,c){

 if(!(await payCost(p,c.d.cost,c)))return false;
 const from=FX.fromHand(p,c);p.hand.splice(p.hand.indexOf(c),1);
 if(G.field){const old=G.field;G.field=null;resetC(old);G.pl[old.o].grave.push(old);log(`${old.d.name} sale del campo.`)}
 c.o=p.i;c.up=true;G.field=c;log(`${p.name} juega el campo ${c.d.name}.`);render();FX.snd('field');await FX.land(c,from);render();await FX.settle();return true}

/* combate */
async function doAttack(att,tgt){
 const me=cur(),op=opp();att.att=true;
 log(`${att.d.name} (${eATK(att)} ATK) ataca ${tgt?'a '+tgt.d.name:'directamente'}.`);
 const ctx={attacker:att,target:tgt,cancelled:false};
 render();await FX.attack(att,tgt);await fireMon(att,'alAtacar',{attacker:att,target:tgt});if(G.over)return;await react('attack',ctx);if(G.over)return;
 if(ctx.cancelled||!inField(att)||att.pos!=='atk'){log(att.pos!=='atk'&&inField(att)?'El atacante quedó en defensa: el ataque se detiene.':'El ataque no se realiza.');render();return}
 if(!tgt){const dmg=eATK(att);gainNivel(att);gainXP(op);await hurt(op.i,dmg,'battle');render();await FX.settle();return}
 const a=eATK(att);let killed=false,attDead=false;
 await fireMon(tgt,'alSerAtacado',{attacker:att});if(G.over)return
 if(!inField(att)||att.pos!=='atk'||!inField(tgt)){log(inField(att)&&att.pos!=='atk'?'El atacante quedó en defensa: el ataque se detiene.':'El ataque no se realiza.');render();await FX.settle();return}
 let vp='atk',exc=0;
 if(tgt.pos==='atk'){const d=eATK(tgt);
  if(a>d){killed=batKill(tgt);await hurt(op.i,a-d,'battle')}
  else if(a<d){attDead=batKill(att);await hurt(me.i,d-a,'battle')}
  else if(a>=CFG.tieAtk){killed=batKill(tgt);attDead=batKill(att);log(`Empate a ${a} ATK (${CFG.tieAtk} o más): ambos monstruos son destruidos.`)}
  else log(`Empate a ${a} ATK: ningún monstruo se destruye.`)
 }else{const d=eDEF(tgt);vp='def';
  if(a>d){killed=batKill(tgt);exc=a-d;const pe=eqOn(att,'equipoPerforar');if(pe){log(`${pe.d.name}: ${att.d.name} perfora la defensa.`);await hurt(op.i,exc,'battle');exc=0}}
  else if(a<d){await hurt(me.i,d-a,'battle')}else log('Sin daño.')}
 if(G.over)return;
 if(killed)await fireMon(att,'alDestruirEnBatalla',{victimPos:vp,exceso:exc,victim:tgt});
 else if(attDead&&inField(tgt))await fireMon(tgt,'alDestruirEnBatalla',{victimPos:'atk',victim:att});
 if(G.over)return;
 if(inField(att))gainNivel(att);if(inField(tgt))gainNivel(tgt);
 render();await FX.settle();
}

/* reacciones */
function rOK(z,win,ctx,p){const e=z.d.ef,me=G.pl[1-p.i];
 switch(e.objetivo){
  case'atacante':if(!(win==='attack'&&me.mons.includes(ctx.attacker)))return false;break;
  case'monstruoRival':if(!me.mons.some(Boolean))return false;break;
  case'monstruoCampo':if(![...p.mons,...me.mons].some(Boolean))return false;break;
  case'cartaCampoRival':if(!(me.mons.some(Boolean)||me.zones.some(Boolean)))return false;break;
  case'cartaARRival':if(!arRival(me).length)return false;break;
  case'monstruoRivalDef':if(!me.mons.some(m=>m&&m.pos==='def'))return false;break;
  case'reaccionRival':if(!me.zones.some(z=>z&&z.d.type==='R'&&!z.up))return false;break;
  case'accionPermRival':if(!me.zones.some(z=>z&&z.d.type==='A'&&z.d.perm&&z.up))return false;break;
  case'monstruoMio':if(!p.mons.some(Boolean))return false;break}
 const a=e.accion.tipo;if(a==='buscarMazo')return llamOK(z,p,e.accion);if(a==='curar')return(e.objetivo==='yo'?p:me).lp<CFG.lp;if(a==='ganarXp')return p.xp<xpCap();return true}
async function react(win,ctx){
 for(let g=0;g<3;g++){
  if(G.over||ctx.cancelled)return;const p=opp();if(p.noReactT===G.turn||arLock(p))return;
  const all=p.zones.filter(z=>z&&z.d.type==='R'&&z.d.windows.includes(win)&&!(z.d.perm&&z.ut===G.turn)&&reqOK(p,z.d)&&rOK(z,win,ctx,p));
  const opts=all.filter(z=>canPay(p,z.d.cost,null));
  if(!opts.length)return;
  const ch=p.ai?aiReact(p,opts,win,ctx):await humanReact(p,opts,win,ctx,all);
  if(!ch)return;await runReaction(p,ch,win,ctx);
 }
}
function aiPickFor(e,opts){const a=e.accion,bad=['destruir','devolverMano','devolverMazo','fijarNivel0'].includes(a.tipo)||(a.tipo==='cambiarStat'&&a.valor<0);
 const s=[...opts].sort((x,y)=>(x.d&&isM(x)?val(x):1500)-(y.d&&isM(y)?val(y):1500));return bad||a.tipo==='cambiarStat'?s[s.length-1]:s[0]}
/* la carta de Acción/Reacción rival que más conviene destruir */
function aiARPick(L){const sc=x=>{if(x.d.type==='F')return x.d.fi===G.pl[x.o].fi?2600:900;if(x.d.perm==='equip'){const t=x.eq!=null?byUid(x.eq):null;return 1400+(t?val(t)/3:0)}if(x.d.perm)return 1500;return x.d.type==='R'?1700:1000};return [...L].sort((a,b)=>sc(b)-sc(a))[0]}
function aiTarget(z,win,ctx,me,opts){const id=z.d.id;if(['cartaARRival','reaccionRival','accionPermRival'].includes(z.d.ef.objetivo))return aiARPick(opts);
 if(id==='R2')return [...opts].sort((a,b)=>(b.pos==='def')-(a.pos==='def')||eN(b)-eN(a))[0];
 if(id==='R4')return aiR4(win,ctx,me);
 const a=z.d.ef.accion.tipo;if(['destruir','devolverMano','devolverMazo'].includes(a)){const k=win==='summon'?ctx.card:win==='attack'?ctx.attacker:null;if(k&&opts.includes(k))return k;return aiPickFor(z.d.ef,opts)}
 return opts[0]}
async function runReaction(p,z,win,ctx){
 const me=cur(),e=z.d.ef;let tgt=null;
 if(PICK.includes(e.objetivo)){const opts=posibles(p,e,ctx);
  tgt=p.ai?aiTarget(z,win,ctx,me,opts):await pickTarget(`${z.d.name}: ${PICKMSG[e.objetivo]}`,opts);if(!tgt)return}
 if(!(await payCost(p,z.d.cost,null,tgt)))return;
 if(z.d.perm){z.up=true;z.ut=G.turn}else{p.zones[p.zones.indexOf(z)]=null;p.grave.push(z)}log(`${p.name} activa ${z.d.name}.`,0);render();await FX.pop(z);
 await resolver(e,z,p,ctx,{t:tgt});
 render();await FX.settle();await sleep(UI.speed/2);
}
function aiR4(win,ctx,me){const ms=me.mons.filter(Boolean);
 if(win==='attack'&&me.mons.includes(ctx.attacker))return ctx.attacker;
 if(win==='summon'&&me.mons.includes(ctx.card))return ctx.card;
 return ms.sort((a,b)=>val(b)-val(a))[0]||me.zones.find(Boolean)}
function aiReact(p,opts,win,ctx){
 const me=cur(),has=id=>opts.find(z=>z.d.id===id),att=ctx.attacker,tg=ctx.target;
 const r3=has('R3');if(r3&&win==='attack'){
  if(!tg){if(eATK(att)>=1500||p.lp<=eATK(att)*2)return r3}
  else if(tg.pos==='atk'?eATK(att)>=eATK(tg):eATK(att)>eDEF(tg))return r3}
 const r1=has('R1');if(r1&&win==='attack'&&att.boost==='atk'&&eN(att)>=300){
  const base=eATK(att)-eN(att);
  if(!tg||(tg.pos==='atk'?(eATK(att)>=eATK(tg)&&base<eATK(tg)):(eATK(att)>eDEF(tg)&&base<=eDEF(tg))))return r1}
 const r4=has('R4');if(r4&&p.hand.length>=3){
  if(win==='attack'&&eATK(att)>=2500)return r4;
  if(win==='summon'&&ctx.card.d.sac>=2)return r4;
  if(win==='endTurn'&&me.mons.some(m=>m&&m.d.sac>=3))return r4}
 const r5=has('R5');if(r5&&p.lp<=5000)return r5;
 const r2=has('R2');if(r2&&win==='endTurn'&&me.mons.some(m=>m&&m.pos==='def'&&eN(m)>=200))return r2;
 for(const z of opts){if(/^R[1-5]$/.test(z.d.id))continue;const ac=z.d.ef.accion.tipo;
  if((ac==='negarAtaque'||(ac==='cambiarPosicion'&&z.d.ef.objetivo==='atacante'))&&win==='attack'&&(att&&eATK(att)>=1500||p.lp<=5000))return z;
  if(ac==='destruir'&&z.d.ef.objetivo==='cartaARRival'){if(arRival(me).some(x=>x.up||x.d.type==='F'))return z;continue}

  if(ac==='destruir'&&win==='summon'&&ctx.card&&(ctx.card.d.sac>=1||ctx.card.d.at>=1800))return z;

  if(ac==='curar'&&p.lp<=5000)return z;
  if(ac==='cambiarStat'&&win==='attack'&&z.d.ef.objetivo==='atacante'&&att&&(!tg||eATK(att)>=(tg.pos==='atk'?eATK(tg):eDEF(tg))))return z;
  if(ac==='robar'&&p.hand.length<=3)return z;if(ac==='buscarMazo'&&p.hand.length<=4&&p.lp>2000)return z;if(ac==='infligirDano'&&win!=='damage')return z}
 return null}

function recInfo(p,c){
 if(p!==cur()||G.phase!=='main'||p.ai)return{ok:false,why:'Solo en tu fase principal.',cost:''};
 const d=c.d;
 if(isM(c)){const n=Math.max(1,d.sac);const pool=p.hand.filter(x=>isM(x)&&x.d.fac===d.fac);return{ok:pool.length>=n,why:`Necesitas ${n} monstruo(s) de ${FAC[d.fi].n} en tu mano.`,cost:`Descartar ${n} de la facción`,pool,n}}
 if(d.type==='A')return{ok:p.lp>CFG.recActLP,why:'No tienes LP suficiente.',cost:`${CFG.recActLP} LP`};
 return{ok:p.xp>=CFG.recReaXP,why:'No tienes XP suficiente.',cost:`${CFG.recReaXP} XP`}}
async function recover(p,c){
 const r=recInfo(p,c);if(!r.ok)return;
 if(isM(c)){const ch=await pickCards(`Descarta ${r.n} monstruo(s) de la facción para recuperar ${c.d.name}`,r.pool,r.n,r.n);if(!ch)return;ch.forEach(x=>{p.hand.splice(p.hand.indexOf(x),1);p.grave.push(x)})}
 else if(c.d.type==='A')p.lp-=CFG.recActLP;else p.xp-=CFG.recReaXP;
 if(FX.recover)FX.recover(p,c);p.grave.splice(p.grave.indexOf(c),1);joinHand(p,c);log(`${p.name} recupera ${c.d.name} del cementerio a la mano.`);
}

 const v=await modal(`<h3>Cementerio de ${p.name} (${p.grave.length})</h3><p class="mut">Las cartas del cementerio están casi perdidas. Recuperarlas tiene un costo fijo y las deja en la mano.</p>${rows}<div class="mbtns"><button data-m="x">Cerrar</button></div>`);

 for(const x of opts){const c=x.c;
  if(sacReq(c)>0){const sac=aiPickSacs(x.s.pool,sacReq(c));const lost=sac.reduce((a,m)=>a+m.d.at+m.nivel,0);if(c.d.at<lost*.6+400)continue}
  const em=o.mons.filter(Boolean);const strong=em.some(m=>m.pos==='atk'&&eATK(m)>c.d.at);

 if((c=has('A4'))&&p.hand.length>=3){const ms=o.mons.filter(Boolean).sort((a,b)=>val(b)-val(a));const t=ms[0]&&val(ms[0])>1800?ms[0]:(!ms.length?o.zones.find(Boolean):null);if(t){await playAction(p,c,{t});await S()}}
 if((c=has('A5'))&&p.lp>800)for(const a of attackers())for(const t of o.mons.filter(Boolean)){const st=t.pos==='atk'?'atk':'def',v=st==='atk'?eATK(t):eDEF(t);if(has('A5')&&eATK(a)<=v&&eATK(a)>v-600){await playAction(p,c,{t,alt:st==='atk'?0:1});await S();break}}

  if(ok&&p.hand.includes(c)){await playAction(p,c,{t:a});await S();break}}
 if((c=p.hand.find(x=>x.d.id==='A2'))&&p.hand.length>=4){const m=p.mons.filter(x=>x&&x.pos==='def')[0];if(m&&o.mons.some(Boolean)){await playAction(p,c,{t:m});await S()}}

/* IA genérica para Acciones instantáneas de facción (las del set general tienen su propia lógica arriba) */
async function aiGeneric(p){
 const o=opp(),S=()=>sleep(UI.speed),atks=()=>p.mons.filter(m=>m&&canAttack(m));
 for(const c of [...p.hand]){if(G.over||!p.hand.includes(c))continue;const d=c.d;
  if(d.type!=='A'||d.perm||/^A[1-6]$/.test(d.id)||!d.ef||!canPay(p,d.cost,c))continue;
  if(d.cost.t==='lp'&&p.lp<=d.cost.v+1500)continue;if(d.cost.t==='disc'&&p.hand.length<=d.cost.v+1)continue;
  const e=d.ef,a=e.accion.tipo,em=o.mons.filter(Boolean);let t=null,go=false;
  if(a==='destruir'&&e.objetivo==='monstruoRival'){t=em.sort((x,y)=>val(y)-val(x))[0];go=t&&val(t)>=1800}
  else if(a==='destruir'&&e.objetivo==='monstruoRivalDef'){t=em.filter(m=>m.pos==='def').sort((x,y)=>val(y)-val(x))[0];go=!!t&&val(t)>=1500}
  else if(a==='destruir'&&(e.objetivo==='reaccionRival'||e.objetivo==='accionPermRival')){const L=posibles(p,e,null);t=L.length?aiARPick(L):null;go=!!t}
  else if(a==='descartarAzar'&&e.objetivo==='jugadorRival')go=o.hand.length>=2;
  else if(a==='curar'&&e.objetivo==='yo')go=p.lp<=CFG.lp-e.accion.n;
  else if(a==='ganarXp')go=p.xp+e.accion.n<=xpCap();
  else if(a==='recuperar')go=p.grave.some(isM)&&p.hand.length<=4;
  else if(a==='destruir'&&e.objetivo==='cartaARRival'){const L=arRival(o);t=L.length?aiARPick(L):null;go=!!t&&(t.d.type!=='F'||t.d.fi===o.fi)}
  else if(a==='moler'&&e.objetivo==='jugadorRival')go=o.deck.length>0;
  else if(a==='infligirDano'&&e.objetivo==='jugadorRival')go=true;
  else if(a==='teletransportar'){const ms=p.mons.filter(m=>m&&teleOpts(p,m).length).map(m=>({m,g:Math.max(...teleOpts(p,m).map(val))-val(m),risk:em.some(x=>x.pos==='atk'&&eATK(x)>(m.pos==='atk'?eATK(m):eDEF(m)))})).filter(x=>x.g>300||(x.risk&&x.g>=0)).sort((x,y)=>y.g-x.g);t=ms[0]&&ms[0].m;go=!!t}
  else if(a==='buscarMazo')go=llamOK(c,p,e.accion)&&p.hand.length<=4;
  else if(a==='robar'&&e.objetivo==='yo')go=p.hand.length<=3&&(d.cost.t!=='devolverMano'||p.mons.some(m=>m&&eATK(m)<1600&&!m.att)||p.summoned===false);
  else if(a==='cambiarPosicion'&&e.objetivo==='monstruoRival'){t=em.filter(m=>m.pos==='atk').find(m=>atks().some(x=>eATK(x)>eDEF(m)&&eATK(x)<=eATK(m)));go=!!t}
  else if(a==='cambiarStat'&&e.objetivo==='monstruoRival'&&e.accion.valor<0){t=em.find(m=>atks().some(x=>{const v=m.pos==='atk'?eATK(m):eDEF(m);return eATK(x)<=v&&eATK(x)>v+e.accion.valor}));go=!!t}
  if(go){await playAction(p,c,t?{t}:{});await S()}}
}
async function aiPerm(p){
 const S=()=>sleep(UI.speed);
 for(const c of [...p.hand]){if(G.over||!p.hand.includes(c))continue;
  if(c.d.type==='F'){const f=G.field;const mine=p.mons.filter(Boolean).length>0||p.hand.some(isM);
   if(!canPay(p,c.d.cost,c)||!mine)continue;
   const better=!f||(f.o!==p.i&&true)||(f.d.fi!==p.fi&&c.d.fi===p.fi);
   if(c.d.fi===p.fi&&better&&(!f||f.d.id!==c.d.id)){await playField(p,c);await S()}}
  else if(c.d.type==='A'&&c.d.perm&&p.zones.includes(null)&&canPay(p,c.d.cost,c)&&p.lp>c.d.cost.v+1500*(c.d.cost.t==='lp')){
   const ms=p.mons.filter(Boolean).filter(m=>!(c.d.perm==='equip'&&c.d.fi>=0&&m.d.fi!==c.d.fi)).sort((a,b)=>val(b)-val(a));if(!ms.length)continue;
   const a=c.d.ef.accion;if(a.tipo==='cambiarStat'&&a.valor<=0&&c.d.perm==='equip')continue;
   if(c.d.perm==='equip'){const free=m=>!p.zones.some(z=>z&&z.eq===m.uid&&z.d.ef.accion.tipo===a.tipo&&a.tipo!=='cambiarStat');let t;
    if(a.tipo==='equipoProteccion')t=ms.find(free);
    else if(a.tipo==='equipoMaximizar')t=ms.filter(free).find(m=>m.pos==='atk'&&eDEF(m)<1800)||null;
    else if(a.tipo==='equipoPerforar')t=ms.filter(free).find(m=>m.pos==='atk');
    else if(a.tipo==='equipoSabiduria')t=ms.filter(free).filter(m=>capOf(m)-m.nivel>=200).sort((x,y)=>(capOf(y)-y.nivel)-(capOf(x)-x.nivel))[0];
    else t=ms.find(m=>m.pos==='atk')||ms[0];
    if(!t)continue;await playAction(p,c,{t});await S()}
   else if(ms.length>=2||a.valor>0){await playAction(p,c,{});await S()}}}
}
async function aiBattle(p){
/* un monstruo que todavía puede frenar un ataque este turno (pone al atacante en defensa) */
const frena=t=>effs(t).some((e,i)=>e.disparador.tipo==='alSerAtacado'&&e.accion.tipo==='cambiarPosicion'&&e.objetivo==='atacante'&&!(e.limite==='unaVezTurno'&&t.lt&&t.lt[i]===G.turn)&&!(e.limite==='unaVezDuelo'&&t.lt&&t.lt['d'+i]));
 const ord=[...p.mons].filter(Boolean).sort((x,y)=>eATK(x)-eATK(y));
 for(const a of ord){
  if(G.over)return;if(!a||!canAttack(a))continue;const o=opp();const tg=o.mons.filter(Boolean);
  if(!tg.length){await doAttack(a,null);await sleep(UI.speed);continue}
  let best=null,bs=0;const av=eATK(a);
  for(const t of tg){let s;
   if(t.pos==='atk'){const d=eATK(t);s=av>d?500+d+(av-d)*.3:(av===d&&val(t)>val(a)+300?200:-1)}
   else{const d=eDEF(t);s=av>d?300+d*.5:-1}
   if(s>0&&frena(t))s=a===ord.find(x=>canAttack(x))?s:s-450;
   if(s>bs){bs=s;best=t}}
  if(best){await doAttack(a,best);await sleep(UI.speed)}
 }
}

function actionsFor(c){

 if(p.ai||c.o!==p.i)return[];const L=[];
 const ph=G.phase,main=ph==='main',bat=ph==='battle',fin=ph==='end';

  L.push({l:'Atacar',dis:!!why,why,fn:async()=>{const o=opp();const tg=o.mons.filter(Boolean);if(!tg.length)await doAttack(c,null);else{const t=await pickTarget('Elige el monstruo atacado',tg);if(t)await doAttack(c,t)}}});

function rules(){return modal(`<h3>Reglas de este prototipo</h3><div class="rtxt">
<h4>Cómo se gana</h4><ul><li>Llevas a 0 los LP del rival. Cada jugador empieza con 8000 y ese es su tope. Quien no puede robar al empezar su turno pierde (supuesto).</li></ul>
<h4>Fases del turno</h4><ul><li><b>Fase principal:</b> robas, invocas (1 por turno), colocas Reacciones, juegas Acciones, potencias y cambias posiciones.</li><li><b>Fase de batalla:</b> solo si tienes monstruos que puedan atacar. Cada uno ataca una vez.</li><li><b>Fase final:</b> puedes jugar Acciones y colocar más Reacciones. Luego cedes el turno.</li></ul><h4>Reacciones</h4><ul><li>Cada Reacción dice en qué momento se activa: cuando el rival ataca, cuando invoca, al final de su turno o cuando recibes daño. Esa oportunidad dura todo el turno del rival.</li><li>Cuando el momento llega y tienes una Reacción colocada que puedas pagar, el juego pregunta: <i>¿Activar carta de Reacción colocada?</i> Si dices Sí, tocas la que quieres. Si dices No, el turno sigue.</li><li>En un mismo momento se pueden encadenar hasta 3 Reacciones.</li></ul><h4>Turno</h4><ul><li>Robas 1 (quien empieza no roba en el primer turno). Mano inicial de 5, máximo 7 al terminar el turno.</li><li>Fase principal: 1 invocación por turno, colocar Reacciones, jugar Acciones, potenciar con Nivel, cambiar posición.</li><li>Fase de batalla: cada monstruo ataca una vez. Un monstruo puede atacar el mismo turno en que entra. Solo en el primer turno del duelo nadie ataca. Ataque directo solo si el rival no tiene monstruos.</li></ul>
<h4>Quién empieza</h4><ul><li>Cada jugador tira un dado de 6 caras. El mayor empieza primero (si empatan, se repite). En el marcador de cada jugador se ve si va PRIMERO o SEGUNDO.</li></ul>
<h4>Cartas que se quedan en la zona</h4><ul><li>Las 3 zonas de Acción/Reacción son compartidas por todo lo que se queda en juego, así que cada una que dejas ahí es una decisión.</li><li><b>Equipo:</b> se coloca boca arriba sobre uno de tus monstruos y le da un bono permanente. Si ese monstruo deja el campo (destruido o devuelto a la mano), el equipo va al cementerio. Hay equipos especiales: <b>protección</b> (se destruye en lugar del monstruo en batalla), <b>perforación</b> (el monstruo perfora la defensa) y <b>maximizar el ataque</b> (más ATK, DEF a 0 y pierdes 500 LP si el monstruo es destruido, también al sacrificarlo).</li><li><b>Continua:</b> se queda boca arriba y da un bono a todos tus monstruos mientras siga en tu zona.</li><li><b>Reacción continua:</b> se coloca boca abajo como cualquier Reacción, pero después de activarse se queda en la zona (boca arriba) y puede volver a activarse, como máximo una vez por turno.</li></ul>
<h4>Carta de Campo</h4><ul><li>Hay una sola zona de campo, en la fila central del tablero, compartida por ambos jugadores. Se juega en tu fase principal pagando su costo. Si juegas otra, la anterior va al cementerio de quien la jugó.</li><li>Afecta a los monstruos de los dos lados según su facción: suele fortalecer a la facción de la carta y debilitar a las demás. La imagen de la carta queda de fondo del tablero. Los mazos solo incluyen la carta de campo de su facción.</li></ul>
<h4>Nivel del monstruo</h4><ul><li>El tope de Nivel son las estrellas ×100. Sacrificios: 1 a 4 estrellas ninguno, 5 y 6 uno, 7 y 8 dos, 9 a 12 tres.</li><li>Empieza en 0 y sube la velocidad del monstruo (+100 por defecto) cada vez que participa en una batalla, incluso un ataque directo, hasta su tope. Se pierde al salir del campo. Se ve como número en la esquina de su casilla.</li><li>Una vez por turno puedes potenciar un monstruo: suma su Nivel a ATK (en ataque) o a DEF (en defensa) hasta tu próximo turno. No gasta Nivel. En el campo cada carta muestra el stat de su posición: azul si está aumentado, rojo si está reducido.</li></ul>
<h4>XP del jugador</h4><ul><li>+100 por cada ataque directo recibido, hasta un tope compartido que empieza en ${CFG.xpCap0} (supuesto) y sube +${CFG.xpCapStep} cada 2 rondas. La XP se gasta. Cada punto del marcador son 100 XP.</li></ul>
<h4>Costos y recuperación</h4><ul><li>Cada carta paga con LP, descartes o XP (se ve en la carta). No puedes pagar un costo en LP que te deje en 0.</li><li>Los monstruos pesados se invocan sacrificando monstruos de su facción en tu campo. Un veterano (Nivel ${CFG.vetNivel}+) vale ${CFG.vetValue} (supuesto).</li><li>Cementerio (tócalo): recuperar un monstruo cuesta descartar de tu mano tantos monstruos de su facción como sacrificios pide (mínimo 1) y vuelve a la mano. Una Acción cuesta ${CFG.recActLP} LP. Una Reacción cuesta ${CFG.recReaXP} XP.</li></ul>
<h4>Combate</h4><ul><li>Ataque contra ataque: gana el mayor, la diferencia es daño. Si empatan, no se destruyen, salvo que el ATK sea ${CFG.tieAtk} o más: entonces ambos se destruyen. Contra defensa: si ATK supera DEF se destruye sin daño. Si DEF es mayor, quien ataca pierde la diferencia en LP.</li></ul></div><div class="mbtns"><button class="pri" data-m="x">Cerrar</button></div>`)}

async function rollFirst(){
 const nm=[G.pl[0].name,G.pl[1].name],ov=document.createElement('div');ov.id='dice';document.body.appendChild(ov);
 const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
 const face=n=>`<div class="die">${Array.from({length:9},(_,i)=>PIP[n].includes(i)?'<i></i>':'<b></b>').join('')}</div>`;
 ov.innerHTML=`<div class="dbox"><h3>¿Quién empieza?</h3><p>Cada jugador tira un dado de 6 caras. Gana la tirada el número mayor y empieza el duelo.</p><div class="drow"><div><span>${nm[0]}</span><div data-d="0"></div></div><div><span>${nm[1]}</span><div data-d="1"></div></div></div><div class="dmsg">&nbsp;</div><div class="mbtns"><button class="pri" data-dok disabled>Tirando…</button></div></div>`;
 const q=x=>ov.querySelector(x),set=(a,b)=>{q('[data-d="0"]').innerHTML=face(a);q('[data-d="1"]').innerHTML=face(b)},rnd=()=>1+Math.random()*6|0;
 let a,b;
 do{q('.drow').classList.add('roll');for(let k=0;k<16;k++){set(rnd(),rnd());Snd.sfx('dice');await sleep(60+k*14)}
  a=rnd();b=rnd();set(a,b);Snd.sfx('dicefin');q('.drow').classList.remove('roll');
  if(a===b){q('.dmsg').textContent=`Empate (${a} y ${b}). Se vuelve a tirar.`;await sleep(1100)}}while(a===b);
 const w=a>b?0:1;q('.dmsg').innerHTML=`<b>${nm[w]}</b> sacó ${w?b:a} contra ${w?a:b}: empieza <b>primero</b>. ${nm[1-w]} juega <b>segundo</b>.`;
 q(`[data-d="${w}"]`).classList.add('win');
 const bt=q('[data-dok]');bt.disabled=false;bt.textContent='Comenzar';
 await new Promise(r=>bt.addEventListener('click',r,{once:true}));ov.remove();return w}

function recBase(name){
 const fi=rndFac(),ms=MONS.filter(d=>d.fi===fi),cnt=new Map();let tot=0;
 const add=d=>{const id=cid(d);cnt.set(id,(cnt.get(id)||0)+1);tot++};
 ms.forEach(add);for(const d of SP.filter(d=>d.fi<0||d.fi===fi)){if(tot>=REC_MIN)break;add(d)}
 const cheap=[...ms].sort((a,b)=>a.cap-b.cap);let k=0;
 while(tot<REC_MIN&&cheap.length&&k<200){const d=cheap[k++%cheap.length];if((cnt.get(cid(d))||0)<maxCop(d))add(d)}

 if(!REC.list.length){REC={list:[recBase('receta1')],sel:null};}

function recipeInfo(r){
 const idx=cardIdx();let n=0,mon=0,sp=0,miss=0;const cards=[];
 r.cards.forEach(c=>{const d=idx.get(c.id);const k=Math.max(0,Math.min(d?maxCop(d):REC_COP,c.n|0));if(!d){miss+=k;return}n+=k;if(d.kind!==undefined)mon+=k;else sp+=k;if(k)cards.push({d,n:k})});
 const err=[],warn=[];
 if(n<REC_MIN)err.push(`Faltan ${REC_MIN-n} carta(s): mínimo ${REC_MIN}.`);
 if(n>REC_MAX)err.push(`Sobran ${n-REC_MAX} carta(s): máximo ${REC_MAX}.`);
 if(mon<1)err.push('Necesita al menos un monstruo.');
 const lk=cards.filter(c=>c.d.lock).reduce((a,c)=>a+c.n,0);if(lk)err.push(`${lk} carta(s) son de una facción bloqueada.`);
 if(miss)warn.push(`${miss} carta(s) ya no existen en este set y se ignoran.`);
 const fm={};cards.forEach(({d,n})=>{if(d.kind!==undefined)fm[d.fi]=(fm[d.fi]||0)+n});
 const hard=cards.filter(({d})=>d.kind!==undefined&&d.sac>0&&(fm[d.fi]||0)-1<d.sac).length;
 if(hard)warn.push(`${hard} monstruo(s) piden sacrificios de su facción y el mazo no tiene suficientes de ella.`);
 const triples=cards.filter(c=>c.n===REC_COP).length;
 let top=-1,tn=0;Object.entries(fm).forEach(([f,v])=>{if(v>tn){tn=v;top=+f}});
 return{n,mon,sp,miss,err,warn,cards,triples,fi:top<0?0:top,ok:!err.length}}

/* ============ SONIDO: futurista + post-punk, todo sintetizado con Web Audio (sin archivos) ============
   · Efectos (Snd.sfx): bips digitales para clics y sonidos que acompañan cada animación.
   · Música (Snd.music): 5 temas que se generan en vivo: calm (inicio y partida), losing (perdiendo),
     winning (a punto de ganar), defeat (derrota) y victory (victoria). */
const Snd=(()=>{
 const KEY='tcg.snd',AC=window.AudioContext||window.webkitAudioContext;
 const cfg={sfx:1,mus:1,vol:.8};
 try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')Object.assign(cfg,r)}catch(e){}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}};
 const mtof=m=>440*Math.pow(2,(m-69)/12);
 const mo={m:'calm',t:0,over:0};
 let G0=null,seqs=[],want=null,cur=null,timer=0,last={};

 /* ---------- grafo de audio ---------- */
 function mkGraph(c){
  const g={c};
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
  g.master=c.createGain();g.master.gain.value=cfg.vol;g.master.connect(comp);comp.connect(c.destination);
  g.mus=c.createGain();g.mus.gain.value=cfg.mus?.7:0;g.mus.connect(g.master);
  g.amb=c.createGain();g.amb.gain.value=cfg.sfx?.9:0;g.amb.connect(g.master);
  g.sfx=c.createGain();g.sfx.gain.value=cfg.sfx?1.8:0;g.sfx.connect(g.master);
  const len=Math.floor(c.sampleRate*1.7),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const cv=c.createConvolver();cv.buffer=ir;const rg=c.createGain();rg.gain.value=.55;cv.connect(rg);rg.connect(g.master);
  g.revIn=c.createGain();g.revIn.connect(cv);
  g.dly=c.createDelay(1);g.dly.delayTime.value=.36;
  const fb=c.createGain();fb.gain.value=.36;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const dout=c.createGain();dout.gain.value=.55;
  g.dlyIn=c.createGain();g.dlyIn.connect(g.dly);g.dly.connect(lp);lp.connect(fb);fb.connect(g.dly);lp.connect(dout);dout.connect(g.master);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;g.noise=nb;
  const k=2048,cu=new Float32Array(k);for(let i=0;i<k;i++){const x=i*2/k-1;cu[i]=Math.tanh(x*4)}g.curve=cu;
  return g}

 /* ---------- piezas básicas ---------- */
 const sendTo=(g,node,rv,dl)=>{const c=g.c;if(rv){const s=c.createGain();s.gain.value=rv;node.connect(s);s.connect(g.revIn)}if(dl){const s=c.createGain();s.gain.value=dl;node.connect(s);s.connect(g.dlyIn)}};
 function tone(g,out,t,o){const c=g.c,os=c.createOscillator(),e=c.createGain(),dur=o.dur||.2,a=o.a||.003,v=o.v==null?.3:o.v;
  os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);if(o.det)os.detune.value=o.det;
  let n=os;
  if(o.hp){const b=c.createBiquadFilter();b.type='highpass';b.frequency.value=o.hp;n.connect(b);n=b}
  if(o.lp){const b=c.createBiquadFilter();b.type='lowpass';b.frequency.value=o.lp;if(o.lp2)b.frequency.exponentialRampToValueAtTime(o.lp2,t+dur);n.connect(b);n=b}
  if(o.dist){const w=c.createWaveShaper();w.curve=g.curve;n.connect(w);n=w}
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||18;l.connect(lg);lg.connect(os.detune);l.start(t);l.stop(t+dur+.1)}
  n.connect(e);e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(v,t+a);
  if(o.hold)e.gain.setValueAtTime(v,t+Math.min(o.hold,dur-a));
  e.gain.exponentialRampToValueAtTime(.0001,t+dur);e.connect(out);sendTo(g,e,o.rv,o.dl);os.start(t);os.stop(t+dur+.06)}
 function noise(g,out,t,o){const c=g.c,s=c.createBufferSource(),e=c.createGain(),f=c.createBiquadFilter(),dur=o.dur||.1,v=o.v==null?.3:o.v;
  s.buffer=g.noise;s.loop=true;f.type=o.type||'highpass';f.frequency.setValueAtTime(o.f||3000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
  s.connect(f);f.connect(e);e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(v,t+(o.a||.002));e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  e.connect(out);sendTo(g,e,o.rv,0);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}

 /* ---------- batería y voces de la música ---------- */
 function kit(g,out){return{
  kick:(t,v=1)=>{tone(g,out,t,{f:165,f2:42,dur:.24,v:.9*v,a:.001});noise(g,out,t,{dur:.025,v:.18*v,f:2500})},
  snare:(t,v=1)=>{noise(g,out,t,{dur:.17,v:.5*v,type:'bandpass',f:1900,q:.7,rv:.3});tone(g,out,t,{f:200,f2:120,type:'triangle',dur:.11,v:.35*v})},
  clap:(t,v=1)=>{for(let i=0;i<3;i++)noise(g,out,t+i*.012,{dur:.06,v:.3*v,type:'bandpass',f:1500,q:.8,rv:.3})},
  hat:(t,v=.12,open)=>noise(g,out,t,{dur:open?.2:.04,v,f:7500}),
  tom:(t,f=140,v=.6)=>tone(g,out,t,{f:f*1.6,f2:f,dur:.26,v}),
  bass:(t,m,dur=.14,v=.3,dist)=>{tone(g,out,t,{f:mtof(m),type:'sawtooth',dur,v,lp:900,lp2:300,dist,a:.004});tone(g,out,t,{f:mtof(m-12),dur,v:v*.9})},
  arp:(t,m,dur=.12,v=.1)=>tone(g,out,t,{f:mtof(m),type:'square',dur,v,hp:500,lp:3600,dl:.55,rv:.18,a:.002}),
  pad:(t,ms,dur,v=.05,lp=900)=>ms.forEach(m=>[-9,9].forEach(d=>tone(g,out,t,{f:mtof(m),type:'sawtooth',det:d,dur,v,a:dur*.45,lp,rv:.35}))),
  lead:(t,m,dur,v=.1,o={})=>tone(g,out,t,{f:mtof(m),f2:o.m2?mtof(o.m2):0,type:o.type||'sawtooth',dur,v,a:o.a||.01,lp:o.lp||3200,vib:o.vib||5.5,vd:o.vd||14,dl:.4,rv:.25,dist:o.dist}),
  riser:(t,dur,v=.12)=>noise(g,out,t,{dur,v,f:400,f2:9000,type:'highpass',a:dur*.9,rv:.2})}}

 /* ---------- los 5 temas ---------- */
 const CH={m:[0,3,7],M:[0,4,7]};
 const TRACKS={
  /* inicio y partida: tranquilo, frío, bajo melódico de post-punk con arpegio digital */
  calm:{bpm:96,bars:8,dly:.46875,R:[45,41,48,43,45,41,48,40],Q:'mMMMmMMm',
   step(I,s,b,t){const r=this.R[b],q=CH[this.Q[b]],K=I.k;
    if(s===0||s===10||(s===6&&b%2))K.kick(t,.8);if(s===4||s===12)K.snare(t,.32);
    if(s%2===0)K.hat(t,.1+(s%4===2?.05:0),s===14&&b%2);
    if(s%2===0){const P=[0,12,0,7,12,7,0,12][s/2];K.bass(t,r+12+P,.15,.3)}
    const ai=[0,3,6,8,11,14].indexOf(s);if(ai>=0){const arr=[0,q[1],7,12,q[1]+12,19];K.arp(t,r+24+arr[ai%arr.length],.12,.085)}
    if(s===0&&b%2===0)K.pad(t,q.map(x=>r+12+x),this.sp*32,.045);
    if(b===7&&s>=12)K.tom(t,170-(s-12)*22,.4)}},
  /* perdiendo: desesperación, bombo a fondo, bajo galopante distorsionado, sirena descendente */
  losing:{bpm:132,bars:4,dly:.34,R:[38,39,38,44],Q:'mmmm',
   step(I,s,b,t){const r=this.R[b],K=I.k;
    if(s%4===0||(s===10&&b%2))K.kick(t,1);if(s===4||s===12)K.snare(t,.8);if(s===15)K.snare(t,.25);
    K.hat(t,.09+(s%4===2?.07:0),s===14);
    if([0,2,3,4,6,7,8,10,11,12,14,15].includes(s))K.bass(t,r+(s%4===3?12:0),.1,.38,true);
    if(s===0&&b%2===0)K.lead(t,r+43,this.sp*30,.11,{m2:r+31,dist:true,vd:30});
    if(s===0||s===6||s===10)tone(I.g,I.out,t,{f:mtof(r+36),type:'square',dur:.13,v:.07,lp:2400,det:0,dl:.4})||0;
    if(s===0||s===6||s===10)tone(I.g,I.out,t,{f:mtof(r+42),type:'square',dur:.13,v:.06,lp:2400,dl:.4});
    if(b===3&&s===0)K.riser(t,this.sp*16,.14);
    if(b===3&&s>=12)K.tom(t,150-(s-12)*15,.5)}},
  /* a punto de ganar: tensión que sube, arpegios brillantes, bombo firme y clap */
  winning:{bpm:120,bars:8,dly:.375,R:[40,36,43,38,40,36,43,47],Q:'mMMMmMMM',
   step(I,s,b,t){const r=this.R[b],q=CH[this.Q[b]],K=I.k;
    if(s%4===0)K.kick(t,.9);if(s===4||s===12)K.clap(t,.6);
    if(s%4===2)K.hat(t,.13,true);else if(s%2)K.hat(t,.06);
    if(s%2===0)K.bass(t,r+12+(s%4===2?7:0),.13,.3);
    const arr=[0,q[1],7,12,q[1]+12,19,24,q[1]+24];K.arp(t,r+24+arr[s%8],.1,.07+(s%4===0?.03:0));
    if(s===0&&b%2===0)K.pad(t,q.map(x=>r+24+x),this.sp*32,.04,1800);
    if(s===0&&b%2===1)K.lead(t,r+36+q[1],this.sp*12,.08,{type:'square',vd:8});
    if(b===7&&s>=8)K.snare(t,.25+(s-8)*.07);
    if(b===7&&s===0)K.riser(t,this.sp*16,.1)}},

    const big=el.querySelector('.big');if(big&&(el.classList.contains('dp')?'def':'atk')===it.st)FX.count(big,it.from,it.to);FX.hold(780)}
   else if(it.k==='lv'){FX.float({x:sl.right-8,y:sl.top+2},`+${it.amt} Nv`,'fxl sm',{dy:-26,t:900});FX.hold(250)}

/* ============ DIBUJAR UNA CARTA COMO IMAGEN ============
   La carta se arma con el mismo HTML y CSS del juego dentro de un SVG (foreignObject) y se pasa a un canvas.
   Lo usan el exportador de PNG y las caras de las cartas de la mesa 3D. */
const RASTER={base:600,css:null,sprite:null};
function rasterSVG(html,W,extraCss){
 RASTER.css=RASTER.css||(document.getElementById('cardcss')||{textContent:''}).textContent;
 RASTER.sprite=RASTER.sprite||(document.querySelector('svg[width="0"]')||{outerHTML:''}).outerHTML;
 const B=RASTER.base,BH=B*4/3,H=Math.round(W*4/3);
 const host=document.createElement('div');
 host.innerHTML=`<div style="width:${B}px;height:${BH}px;--cw:${B}px;margin:0;padding:0">${RASTER.sprite}${html}</div>`;
 const root=host.firstElementChild,st=document.createElement('style');st.textContent=RASTER.css+'\n.card{cursor:default;box-shadow:none!important}'+(extraCss||'');root.prepend(st);
 return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${B} ${BH}"><foreignObject x="0" y="0" width="${B}" height="${BH}">${new XMLSerializer().serializeToString(root)}</foreignObject></svg>`}
function rasterLoad(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('No se pudo dibujar la carta.'));i.src=src})}
let RASTER_WARM=false;
async function rasterCard(html,W,extraCss,twice){
 const H=Math.round(W*4/3),url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(rasterSVG(html,W,extraCss));
 /* la primera vez el navegador decodifica las fuentes incrustadas: se dibuja dos veces para que salga con la tipografía correcta */
 if(!RASTER_WARM||twice){await rasterLoad(url);await new Promise(r=>setTimeout(r,140));RASTER_WARM=true}
 const img=await rasterLoad(url+' ');
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,0,0,W,H);return c}
/* las imágenes en archivos aparte (versión web) no se cargan dentro del SVG: se descargan y se incrustan antes de dibujar */
const RASTER_IMG=new Map();
async function rasterInline(url){if(!url||/^data:/.test(url))return url;if(RASTER_IMG.has(url))return RASTER_IMG.get(url);
 const viaImg=()=>new Promise(ok=>{const i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);ok(c.toDataURL('image/jpeg',.92))}catch(_){ok(null)}};i.onerror=()=>ok(null);i.src=url});
 const pr=fetch(url).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>ok(null);f.readAsDataURL(b)})).catch(()=>null).then(u=>u||viaImg());
 RASTER_IMG.set(url,pr);return pr}
async function rasterCardOf(d,W,extraCss,twice){let dd=d;if(d.img&&!/^data:/.test(d.img)){const u=await rasterInline(d.img);dd=Object.assign({},d,{img:u||null})}return rasterCard(cardHTML(dd),W,extraCss,twice)}

   Encima flota el HUD de siempre (mano, puntos, vista previa). Sobre cada carta de la mesa hay un "ancla" invisible
   del HUD (misma posición en pantalla) que recibe los toques y muestra el Nivel y los puntos de ATK/DEF. */

 m3skin(m3get(M3K.mesa,'madera'));
