/* materiales compartidos */
let M3_EDGE=null;const m3edge=()=>M3_EDGE||(M3_EDGE=new THREE.MeshStandardMaterial({color:'#e9e4d8',roughness:.6}));
M3.backMat=()=>M3.bm||(M3.bm=new THREE.MeshStandardMaterial({map:M3.backT||null,color:M3.backT?'#ffffff':'#2c3274',roughness:.55}));
M3.backMat2=()=>M3.bm2||(M3.bm2=new THREE.MeshStandardMaterial({map:M3.backT2||null,color:M3.backT2?'#ffffff':'#2c3274',roughness:.55}));
async function m3backTex(){try{const c=await rasterCard('<div class="card back"><div class="bk"></div></div>',300);const t=m3canvasTex(c);M3.backT=t;const b=M3.backMat();b.map=t;b.color.set('#ffffff');b.needsUpdate=true;const t2=m3canvasTex(c);t2.wrapS=t2.wrapT=THREE.RepeatWrapping;t2.repeat.set(-1,-1);M3.backT2=t2;const b2=M3.backMat2();b2.map=t2;b2.color.set('#ffffff');b2.needsUpdate=true;if(m3get(M3K.mesa,'madera')==='mosaico')m3skin('mosaico');M3.dirty=true}catch(_){}}

/* ---- tapete: zonas dibujadas ---- */
function m3matTex(){const W=1040,H=1220,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const gr=g.createRadialGradient(W/2,H/2,80,W/2,H/2,H*.75);gr.addColorStop(0,'#1d3a35');gr.addColorStop(1,'#0e1f1d');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<9000;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.035})`;g.fillRect(Math.random()*W,Math.random()*H,1.5,1.5)}
 const sx=W/5.2,sz=H/6.1,X=x=>W/2+x*sx,Z=z=>H/2+z*sz;
 g.strokeStyle='#d8c58a';g.lineWidth=4;g.strokeRect(14,14,W-28,H-28);g.lineWidth=1.5;g.strokeRect(26,26,W-52,H-52);
 const zone=(x,z,lab,big)=>{const w=(CW3+.08)*sx,h=(CH3+.08)*sz;g.save();g.translate(X(x),Z(z));g.strokeStyle=big?'#f0d78f':'#c9b982';g.globalAlpha=.85;g.lineWidth=big?4:3;

  if(lab){const L=lab.split('\n');L.forEach((t,i)=>g.fillText(t,0,(i-(L.length-1)/2)*24))}g.restore()};
 [1,-1].forEach(sd=>{const zs=ROWZ.sp*sd,zm=ROWZ.mo*sd;
  zone(COLX[0],zs,'Mazo');zone(COLX[4],zs,'Cementerio');[1,2,3].forEach(i=>zone(COLX[i],zs,'Acción\nReacción'));COLX.forEach(x=>zone(x,zm,'Monstruo'))});
 zone(0,0,'Campo',1);
 g.globalAlpha=.5;g.strokeStyle='#c9b982';g.lineWidth=2;g.setLineDash([10,10]);g.beginPath();g.moveTo(40,H/2);g.lineTo(X(-.55),H/2);g.moveTo(X(.55),H/2);g.lineTo(W-40,H/2);g.stroke();

/* ---- skins de la mesa ---- */
function m3skinTex(id){const N=512,c=document.createElement('canvas');c.width=N;c.height=N;const g=c.getContext('2d');let rep=3,mat={roughness:.7,metalness:0,transparent:false,opacity:1};
 const noise=(a,col)=>{for(let i=0;i<12000;i++){g.fillStyle=col.replace('A',(Math.random()*a).toFixed(3));g.fillRect(Math.random()*N,Math.random()*N,1+Math.random(),1+Math.random())}};
 if(id==='plastico'){g.fillStyle='#ecebe6';g.fillRect(0,0,N,N);noise(.05,'rgba(0,0,0,A)');mat.roughness=.45}
 else if(id==='metal'){g.fillStyle='#8e959c';g.fillRect(0,0,N,N);for(let y=0;y<N;y++){g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},255,${Math.random()*.06})`;g.fillRect(0,y,N,1)}mat.roughness=.32;mat.metalness=.55}
 else if(id==='cristal'){g.fillStyle='#cfeaff';g.fillRect(0,0,N,N);noise(.04,'rgba(255,255,255,A)');mat.roughness=.08;mat.transparent=true;mat.opacity=.32;rep=1}
 else if(id==='mosaico'&&M3.backT&&M3.backT.image){const im=M3.backT.image,w=N/4,h=w*4/3;g.fillStyle='#141a3d';g.fillRect(0,0,N,N);for(let y=-1;y<N/h+1;y++)for(let x=0;x<4;x++){g.save();g.translate(x*w+w/2+(y%2?w/2:0),y*h+h/2);g.rotate(y%2?.12:-.12);g.drawImage(im,-w*.45,-h*.45,w*.9,h*.9);g.restore()}rep=4;mat.roughness=.85}
 else if(id==='propio'){const u=m3get(M3K.mantel,'');if(u){const t=new THREE.TextureLoader().load(u,()=>{M3.dirty=true});t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(7,5.25);return{t,mat:{roughness:.85,metalness:0,transparent:false,opacity:1}}}return m3skinTex('madera')}
 else{/* madera */g.fillStyle='#6e4526';g.fillRect(0,0,N,N);const pw=N/4;
  for(let p=0;p<4;p++){const base=[[110,69,38],[98,61,34],[118,75,42],[104,64,36]][p];g.fillStyle=`rgb(${base})`;g.fillRect(p*pw,0,pw,N);
   for(let l=0;l<46;l++){const x0=p*pw+Math.random()*pw,amp=2+Math.random()*5,ph=Math.random()*6;g.strokeStyle=`rgba(${Math.random()<.5?40:150},${Math.random()<.5?22:95},10,${.08+Math.random()*.18})`;g.lineWidth=.6+Math.random()*1.6;g.beginPath();
    for(let y=0;y<=N;y+=8){const x=x0+Math.sin(y/40+ph)*amp+Math.sin(y/9+ph*2)*.8;y?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
   g.fillStyle='rgba(0,0,0,.35)';g.fillRect(p*pw,0,2,N)}
  noise(.04,'rgba(0,0,0,A)');rep=3}
 const t=m3canvasTex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep*1.4,rep*1.05);return{t,mat}}
function m3skin(id){if(!M3.ready)return;const k=m3skinTex(id),m=M3.top.material;if(m.map&&m.map!==k.t)m.map.dispose();m.map=k.t;m.color.set('#ffffff');Object.assign(m,k.mat);m.needsUpdate=true;
 M3.floor.material.color.set(id==='cristal'?'#3b4560':'#15131c');M3.floor.position.y=id==='cristal'?-1.2:-2.2;
 if(id==='cristal'&&!M3.floorTiles){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'#2b3047':'#3a4262';g.fillRect(x*32,y*32,32,32)}const t=m3canvasTex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(20,20);M3.floorTiles=t}
 M3.floor.material.map=id==='cristal'?M3.floorTiles:null;M3.floor.material.needsUpdate=true;M3.dirty=true}

/* ---- caras de las cartas (se dibujan con el HTML del juego, en segundo plano) ---- */
function m3faceMat(d,prio){const k=d.id+'|'+d.name;let e=M3.tex.get(k);
 if(!e){e={mat:new THREE.MeshStandardMaterial({map:m3fallback(d),roughness:.5})};M3.tex.set(k,e);(prio?M3.queue.unshift.bind(M3.queue):M3.queue.push.bind(M3.queue))([k,d]);m3pump()}
 else if(prio){const i=M3.queue.findIndex(q=>q[0]===k);if(i>0)M3.queue.unshift(M3.queue.splice(i,1)[0])}
 return e.mat}
function m3fallback(d){const c=document.createElement('canvas');c.width=150;c.height=200;const g=c.getContext('2d'),F=d.fi>=0&&FAC[d.fi]?FAC[d.fi]:null;
 g.fillStyle=d.kind?({N:'#c9993d',E:'#d9782f',H:'#2f86b8',T:'#5a46c0'})[d.kind]||'#888':d.type==='A'?'#19b5d1':d.type==='R'?'#d8453a':'#3fae5a';g.fillRect(0,0,150,200);
 g.fillStyle='#0008';g.fillRect(10,30,130,100);g.fillStyle='#fff';g.font='bold 13px Georgia,serif';g.textAlign='center';g.fillText(unescHTML(d.name).slice(0,20),75,20);if(F){g.fillStyle=F.c;g.beginPath();g.arc(75,80,24,0,7);g.fill()}return m3canvasTex(c)}
const unescHTML=s=>String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
async function m3pump(){if(M3.busyTex)return;M3.busyTex=true;
 while(M3.queue.length){const[k,d]=M3.queue.shift();try{const c=await rasterCardOf(d,330),e=M3.tex.get(k);if(e){const old=e.mat.map;e.mat.map=m3canvasTex(c);e.mat.needsUpdate=true;if(old)old.dispose();M3.dirty=true}}catch(_){}await new Promise(r=>setTimeout(r,8))}

function m3prefetch(){if(!G)return;G.pl.forEach(p=>[...p.deck,...p.hand].forEach(c=>m3faceMat(c.d)))}

/* ---- poses (posición + orientación) ---- */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function m3q(yaw,flip){const T=THREE,q=new T.Quaternion().setFromAxisAngle(V3(0,1,0),yaw);if(flip)q.multiply(new T.Quaternion().setFromAxisAngle(V3(0,0,1),Math.PI));return q}
function m3basis(normal,top){const T=THREE,y=normal.clone().normalize(),z=top.clone().negate();z.sub(y.clone().multiplyScalar(z.dot(y))).normalize();const x=new T.Vector3().crossVectors(y,z).normalize();return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(x,y,z))}
const side=pi=>pi===humanIdx()?1:-1;
function m3slot(pi,kind,i){const s=side(pi);if(kind==='m')return V3(COLX[i],0,ROWZ.mo*s);if(kind==='z')return V3(COLX[i+1],0,ROWZ.sp*s);if(kind==='deck')return V3(COLX[0],0,ROWZ.sp*s);if(kind==='grave')return V3(COLX[4],0,ROWZ.sp*s);return V3(0,0,0)}
function pose(p,q,s){return{p,q,s:s||1}}
/* delante de la cámara, a media distancia de la mesa (la carta "aparece de la nada" frente al jugador) */
function m3camBasis(){const T=THREE,c=M3.cam,dir=new T.Vector3();c.getWorldDirection(dir);const up=new T.Vector3(0,1,0).applyQuaternion(c.quaternion),d=c.position.length(),vh=Math.tan(c.fov*Math.PI/360);return{c,dir,up,d,vh}}
function m3front(lift){const{c,dir,up,d,vh}=m3camBasis(),k=d*.5;
 const p=c.position.clone().add(dir.clone().multiplyScalar(k)).add(up.clone().multiplyScalar((lift||0)*k*vh*2));return pose(p,m3basis(dir.clone().negate(),up),k*vh*.8)}
function m3bottom(){const{c,dir,up,d,vh}=m3camBasis(),k=d*.55;
 return pose(c.position.clone().add(dir.clone().multiplyScalar(k)).add(up.clone().multiplyScalar(-k*vh*1.25)),m3basis(dir.clone().negate(),up),k*vh*.5)}
function m3fan(pi,i,n){const T=THREE,s=side(pi),k=n>1?i/(n-1)-.5:0,spread=Math.min(.42,2.6/Math.max(1,n));
 const normal=V3(0,.32,s).normalize(),top=V3(0,1,-.32*s).normalize();let q=m3basis(normal.clone().negate(),top);
 q=new T.Quaternion().setFromAxisAngle(normal,-k*.5*s).multiply(q);
 return pose(V3(k*spread*n*.62,.75+(.18-Math.abs(k)*.3)*.4,(ROWZ.sp+1.05)*s+Math.abs(k)*.08*s),q,1)}
function m3pileTop(pi,kind){const p=G.pl[pi],n=kind==='deck'?p.deck.length:Math.max(0,p.grave.length-1),b=m3slot(pi,kind);b.y=Math.max(.002,n*.0045)+CT3/2;return pose(b,m3q(side(pi)>0?0:Math.PI,kind==='deck'),1)}

/* ---- qué debe haber en la mesa ---- */
function m3want(){const W=new Map(),hi=humanIdx();

/* "ver la mesa": un dedo desplaza la vista sobre el tapete, dos dedos acercan (pellizco), giran (torcer) e inclinan (subir o bajar los dos dedos).
   Con mouse: arrastrar desplaza, arrastrar con botón derecho o con Shift gira e inclina, la rueda acerca.
   El giro y la inclinación están limitados: no se puede rodear la mesa hasta el lado del rival. */
const ORB_LIM={az:.85,pol0:.12,pol1:1.1,d0:.22,d1:1.25,x:2.5,z0:-2.9,z1:3.05};

   const check=()=>{pending=null;ok.disabled=true;const t=ta.value.trim();if(!t){msg.className='cmsg mut';msg.textContent='Todavía no hay nada cargado.';return}
    let d;try{d=JSON.parse(t)}catch(e){msg.className='cmsg bad';msg.textContent='El texto no es un JSON válido: '+e.message;return}
    const r=validateCards(d);if(r.fatal){msg.className='cmsg bad';msg.innerHTML=r.fatal;return}
    const er=r.issues.filter(i=>i.lvl==='e'),wa=r.issues.filter(i=>i.lvl==='w');
    const li=(a,n)=>a.slice(0,n).map(i=>`<li>${i.msg}</li>`).join('')+(a.length>n?`<li>…y ${a.length-n} más</li>`:'');
    if(er.length){msg.className='cmsg bad';msg.innerHTML=`<b>${er.length} error(es): no se puede usar así.</b><ul>${li(er,8)}</ul>`;return}
    pending=r.data;ok.disabled=false;msg.className='cmsg good';
    msg.innerHTML=`<b>Listo:</b> ${esc(r.data.nombre||'Set sin nombre')} · ${r.data.facciones.length} facciones · ${r.data.monstruos.length} monstruos · ${r.data.acciones.length} Acciones y Reacciones.${wa.length?`<br>${wa.length} aviso(s):<ul>${li(wa,6)}</ul>`:''}`};
   ta.addEventListener('input',check);
   box.querySelector('#cfile').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>12e6){msg.className='cmsg bad';msg.textContent='El archivo pesa más de 12 MB.';return}
    const rd=new FileReader();rd.onload=()=>{ta.value=String(rd.result);check()};rd.onerror=()=>{msg.className='cmsg bad';msg.textContent='No se pudo leer el archivo.'};rd.readAsText(f)})}});
  if(v==='apply'&&pending){const saved=useCards(pending,true);renderMenu();
   await modal(`<h3>Set cargado</h3><p><b>${FAC.setName}</b> está listo para jugar.${saved?'':'<br><span class="mut">Este navegador no pudo guardarlo: al cerrar la página tendrás que importarlo de nuevo.</span>'}</p><div class="mbtns"><button class="pri" data-m="x">Aceptar</button></div>`)}
  else if(v==='reset'){useCards(DEFAULT_DATA,false);renderMenu();again=true}}}
/* ============ APP INSTALABLE + PANTALLA COMPLETA ============ */
let INSTALL_EVT=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canInstall=()=>!isStandalone()&&(!!INSTALL_EVT||(isIOS()&&location.protocol==='https:'));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;if(!G)renderMenu()});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;if(!G)renderMenu()});
async function installApp(){
 if(INSTALL_EVT){const e=INSTALL_EVT;e.prompt();try{await e.userChoice}catch(_){}INSTALL_EVT=null;renderMenu();return}
 if(isIOS())modal(`<h3>Instalar en iPhone o iPad</h3><p>En Safari, toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y elige <b>Agregar a pantalla de inicio</b>.</p><div class="mbtns"><button class="pri" data-m="x">Entendido</button></div>`)}
/* pantalla completa: se activa al primer toque (los navegadores exigen un gesto del jugador),
   pero solo mientras el jugador la quiera. Si sale de ella (con el botón o con el gesto del celular), no se vuelve a activar sola. */
const FULL_KEY='gf.pantallaCompleta';
const fullPref=()=>{try{return localStorage.getItem(FULL_KEY)!=='0'}catch(_){return true}};
const setFullPref=v=>{try{localStorage.setItem(FULL_KEY,v?'1':'0')}catch(_){}};
const canFull=()=>!!(document.documentElement.requestFullscreen)&&matchMedia('(pointer:coarse)').matches;
let FULL_BY_US=false;
function enterFull(){try{const d=document.documentElement;if(document.fullscreenElement||!d.requestFullscreen)return;FULL_BY_US=true;
 d.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{FULL_BY_US=false})}catch(_){}}
function exitFull(){FULL_BY_US=false;try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(_){}}
function goFull(){if(fullPref()&&canFull())enterFull()}
document.addEventListener('pointerdown',goFull,{passive:true});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&FULL_BY_US){FULL_BY_US=false;setFullPref(false)}if(!G)renderMenu()});
function toggleFull(){if(document.fullscreenElement){setFullPref(false);exitFull()}else{setFullPref(true);enterFull()}}
/* salir del juego: las páginas web no siempre pueden cerrarse solas; si no se puede, se sale de pantalla completa y se explica cómo volver al celular */
function quitGame(){setFullPref(false);exitFull();try{window.close()}catch(_){}
 setTimeout(()=>{if(!document.hidden)modal(`<h3>Salir del juego</h3><p>Ya saliste de la pantalla completa. Tu celular no deja que el juego se cierre solo: usa el botón o el gesto de <b>inicio</b> (o el de aplicaciones recientes) para volver a tu pantalla.</p><p class="mut">La pantalla completa no se vuelve a activar sola. Para usarla de nuevo, toca el botón de pantalla completa en la portada.</p><div class="mbtns"><button class="pri" data-m="x">Entendido</button></div>`)},350)}
/* service worker: solo en la página publicada (https o localhost) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&typeof BASE_JSON==='string'){
 const had=!!navigator.serviceWorker.controller;let reloaded=false;
 /* cuando llega una versión nueva del juego, la página se recarga sola una vez (si no hay un duelo en curso) */
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;if(!G)location.reload();else UI.pendingReload=true});
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).then(rg=>rg.update()).catch(()=>{})})}

bootCards();
</script>
