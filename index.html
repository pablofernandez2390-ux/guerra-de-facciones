#hand:not(.open) .hx{display:none}
#hand .em{display:none}
#oppx{position:fixed;left:calc(var(--sw) + var(--ph) + 20px);right:0;top:0;z-index:14;display:flex;justify-content:center;pointer-events:none;transform:translateY(-110%);transition:transform .28s;visibility:hidden}
#oppx.open{transform:none;visibility:visible}
#oppx .oc{flex:none;position:relative;width:min(9dvw,64px);height:calc(min(9dvw,64px)*.4);overflow:hidden;margin-left:-6px;filter:drop-shadow(0 3px 4px #000a)}
#oppx .oc .card{--cw:min(9dvw,64px);position:absolute;left:0;bottom:0}
.hbtn{width:100%;font-size:11.5px;padding:5px 6px;margin-top:2px}
.hbtn.on{background:var(--acc);color:var(--accfg)}
#fmenu{position:fixed;left:0;top:0;z-index:20;width:clamp(150px,22vw,210px);max-height:calc(100dvh - 12px);overflow:auto;background:var(--panel);border:1px solid var(--acc);border-radius:9px;padding:4px;display:grid;gap:2px;box-shadow:0 6px 20px var(--shadow)}
#fmenu .t b{font-size:13px;line-height:1.2}
#fmenu .x{padding:1px 8px;line-height:1.2}
#fmenu button.a{text-align:left;font-size:12px;padding:6px 8px;border-color:transparent;background:transparent}#fmenu button.a:not(:disabled):hover{background:var(--acc);color:var(--accfg)}
#fmenu .why{font-size:10.5px;color:var(--mut);margin-top:-2px;line-height:1.2}
#tbar{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--acc);color:var(--accfg);padding:6px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px var(--shadow)}
#tbar button{background:var(--accfg);color:var(--acc);border-color:transparent;padding:3px 10px}
/* cartas */
.card{width:var(--cw);height:calc(var(--cw)*4/3);font-size:max(7.5px,calc(var(--cw)/6.6));border-radius:.22em;background:linear-gradient(160deg,var(--fc),var(--fc2));padding:.3em;display:flex;flex-direction:column;gap:.25em;color:#fff;position:relative;cursor:pointer;box-shadow:0 1px 3px var(--shadow);flex:none;overflow:hidden}
.card .nm{font-size:.8em;font-weight:700;line-height:1.15;background:#0008;border-radius:.3em;padding:.15em .3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .art{flex:1;border-radius:.15em;overflow:hidden;min-height:0;background:#0003}
.card .art svg{width:100%;height:100%;display:block}
.card .sub{display:flex;justify-content:space-between;align-items:center;font-size:.9em;padding:0 .2em;line-height:1}
.card .st{display:flex;justify-content:space-between;font-weight:700;background:#000b;border-radius:.3em;padding:.12em .35em}
.card .big{font-weight:800;font-size:1.55em;background:#000b;border-radius:.3em;padding:.02em .3em;text-align:center;line-height:1.15;font-variant-numeric:tabular-nums}
.card .lv{font-size:.9em;display:flex;justify-content:space-between;padding:0 .2em}
.card .txt{font-size:.9em;line-height:1.25;background:#0009;border-radius:.3em;padding:.3em .4em}
.card .up{color:#7cc0ff}.card .dn{color:#ff8579}
.card.hand .lv{display:none}.card.hand .st{justify-content:center;gap:.3em}.card.hand .st .ic{display:none}.card.hand .st{white-space:nowrap;font-size:.9em}.card.hand .st span+span::before{content:'/ '}.slot.s .card .sub,.slot.s .card .st{display:none}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.card.sel{outline:3px solid #fff;box-shadow:0 0 0 5px var(--acc);z-index:2}
.card.tg{outline:3px solid #ffd54a;animation:pl 1s infinite alternate}
@keyframes pl{to{box-shadow:0 0 0 6px #ffd54a99}}
@media(prefers-reduced-motion:reduce){.card.tg{animation:none}}
.card.dp{transform:rotate(90deg)}
.card.rdy{outline:3px solid #7dff9a;animation:pl2 1s infinite alternate}
@keyframes pl2{to{box-shadow:0 0 0 6px #7dff9a88}}
@media(prefers-reduced-motion:reduce){.card.rdy{animation:none}}
.hint{font-size:11px;color:var(--ink);background:var(--slot);border-radius:6px;padding:4px 6px;line-height:1.25}
.card.used{filter:grayscale(.55) brightness(.88)}
.card.back{background:radial-gradient(circle at 50% 38%,#2c3274,#12153a 78%);box-shadow:inset 0 0 0 .18em #e0b04f55,inset 0 0 0 .3em #0006;align-items:center;justify-content:center;gap:.15em}
.card.back .bk{position:relative;padding:0;width:68%;aspect-ratio:1;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cg fill=%22none%22 stroke=%22%23e0b04f%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 stroke-width=%221%22 opacity=%22.7%22/%3E%3Cpath d=%22M33 84L45 20M67 84L55 20%22/%3E%3Cpath d=%22M45 20L26 27L41 40Z%22 fill=%22%23e0b04f%22/%3E%3Cpath d=%22M55 20L74 27L59 40Z%22 fill=%22%23e0b04f%22/%3E%3Cpath d=%22M50 40L58 54L50 68L42 54Z%22 fill=%22%23e0b04f%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;opacity:.85;margin:0}
.card.back .bk::after{content:'ESTANDARTES\A ETERNOS';white-space:pre;display:block;position:absolute;left:50%;transform:translateX(-50%);top:100%;width:max-content;text-align:center;color:#e0b04f;font-size:.62em;letter-spacing:.14em;line-height:1.25;padding-top:.3em;opacity:.9;text-shadow:0 0 .4em #e0b04f66}
.slot .card.back .bk::after,#oppx .card.back .bk::after,.fxfly .bk::after{display:none}
/* facciones personalizadas */
.fxl{display:grid;gap:4px;max-height:46dvh;overflow:auto;margin:6px 0}
.fxr{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--slot)}
.fxr .fxn{flex:1;min-width:0;display:grid}.fxr .fxn small{color:var(--mut);font-size:11px}.fxr button{padding:4px 9px;font-size:12px;display:flex;align-items:center;gap:4px}.fxr .fxb{font-size:11px}
.lki{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pt.lk .pc{position:relative;filter:grayscale(.6) brightness(.6)}.pt.lk .lki{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;color:#ffd54a;filter:drop-shadow(0 0 4px #000)}
.fk.lk{opacity:.55;position:relative}.fk.lk::after{content:'';position:absolute;right:1px;bottom:1px;width:7px;height:7px;border-radius:50%;background:#ffd54a}
#menu{background:linear-gradient(180deg,#05060fcc 0,#05060f55 30%,#05060f55 60%,#05060fdd 100%),url(img/portada.webp?v=202611121257) center/cover no-repeat;--ink:#f3f1ff;--mut:#c4c8e6;--panel:#0a1024c4;--line:#ffffff4d;--slot:#0a102488;--slotline:#ffffff44;--acc:#ffc680;--accfg:#1a0d00;color:var(--ink)}
#menu button,#menu .rr,#menu .mi label{text-shadow:0 1px 3px #000}
#menu button{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 3px 12px #000c}
#menu button.pri{background:linear-gradient(180deg,#ffd49a,#e3873a);color:#1a0d00;text-shadow:0 1px 0 #fff8;border-color:#ffe2b8;box-shadow:0 0 18px #ff9a3c99,0 4px 14px #000d}
#menu button.ghost{background:#0a102499}
#menu .mt,#menu .sh,#menu h3,#menu h2{text-shadow:0 2px 6px #000,0 0 14px #000}
.cv-t{color:#fff1d2!important;text-shadow:0 0 2px #000,0 3px 0 #000,0 5px 14px #000,0 0 32px #000,0 0 46px #c4122e99!important}
.cv-s{color:#ffd9a8!important;text-shadow:0 2px 6px #000,0 0 14px #000}
.cv-brand{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:7px;color:#e0b04f;font-size:clamp(9px,2.1dvh,12px);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 4px #000,0 0 10px #000;opacity:.92}
.cv-brand svg{width:clamp(18px,4.4dvh,28px);height:clamp(18px,4.4dvh,28px);filter:drop-shadow(0 0 4px #000)}
.cv-logo{max-width:min(92%,700px);max-height:40dvh;object-fit:contain;filter:drop-shadow(0 4px 10px #000) drop-shadow(0 0 24px #000a)}
.cv-f{text-shadow:0 1px 4px #000}
body:has(#menu:not([hidden])){background:#05060f}

<script>
'use strict';
const LOGO_IMG="img/logo.webp?v=202611121257";
/* ============ EFECTOS (formato v2): vocabulario, texto generado, migración y validación ============
   Un efecto = { disparador:{tipo,ventanas?}, condicion:null|{tipo,..}, costo:{tipo,n}, objetivo, accion:{tipo,..}, limite, alternativas? } */
const VENT={ataque:'attack',invocacion:'summon',finTurno:'endTurn',dano:'damage'};
const VENT_ES=Object.keys(VENT);
const DUR_LIM=['finDelTurno','proxTurno','finProxTurno'];
const LIM_ES={ninguno:'Cada vez',unaVezTurno:'Una vez por turno',unaVezDuelo:'Una vez por duelo',finDelTurno:'Hasta el final del turno',proxTurno:'Hasta mi próximo turno',finProxTurno:'Hasta el final de mi próximo turno',mientrasCampo:'Mientras esté en el campo'};
const MON_OBJ=['esteMonstruo','monstruoMio','todosMisMonstruos','monstruoRival','monstruoCampo','atacante'];
/* disparadores: datos que entregan (para comprobar que objetivo y acción tengan de dónde sacar lo que piden) */
const V_TRIG={
 alInvocar:{n:'Al invocar',da:['esteMonstruo'],mon:1},
 alAtacar:{n:'Al atacar',da:['esteMonstruo','atacante'],mon:1},
 alSerAtacado:{n:'Al ser atacado',da:['esteMonstruo','atacante'],mon:1},
 alDestruirEnBatalla:{n:'Al destruir en batalla',da:['esteMonstruo','victima'],mon:1},
 alRecibirDano:{n:'Al recibir daño',da:['esteMonstruo'],mon:1},
 finMiTurno:{n:'Fin de mi turno',da:['esteMonstruo'],mon:1},
 ventana:{n:'Ventana del rival',da:[],carta:1},
 manual:{n:'Manual',da:['esteMonstruo'],mon:1,carta:1},
 continuo:{n:'Continuo',da:['esteMonstruo'],mon:1}};
const V_COND={nivelMin:{n:'Nivel de este monstruo ≥ N',p:['n']},aliadosMin:{n:'Monstruos de mi facción en el campo ≥ N',p:['n']},rivalTieneMas:{n:'El rival tiene más monstruos que yo',p:[]},lpMax:{n:'Mis LP ≤ N',p:['n']},posicionVictima:{n:'El monstruo destruido estaba en ataque o defensa',p:['pos']},manoMin:{n:'Cartas en mi mano ≥ N',p:['n']}};
const V_COSTO={ninguno:'Ninguno',lp:'LP',xp:'XP',descartar:'Descartar',gastarNivel:'Gastar Nivel'};
const V_OBJ={esteMonstruo:'Este monstruo',monstruoMio:'Un monstruo mío',todosMisMonstruos:'Todos mis monstruos',monstruoRival:'Un monstruo rival',monstruoCampo:'Un monstruo del campo',cartaCampoRival:'Una carta del campo rival',atacante:'El atacante',yo:'El jugador (yo)',jugadorRival:'El jugador rival'};
/* acciones: p = parámetros numéricos [clave, etiqueta, valor inicial, máx]; ob = objetivos válidos; dur = exige duración; pas = pasiva (no se "ejecuta") */
const V_ACC={
 robar:{n:'Robar',p:[['n','Cartas',1,3]],ob:['yo']},
 cambiarStat:{n:'Cambiar ATK o DEF',p:[],ob:MON_OBJ,dur:1},
 sinergiaStat:{n:'Sinergia de ATK o DEF',p:[['por','Por aliado',200,1000],['max','Máximo total',600,3000]],ob:['esteMonstruo'],pas:1},
 infligirDano:{n:'Infligir daño',p:[['n','LP',300,3000]],ob:['yo','jugadorRival']},
 curar:{n:'Curar',p:[['n','LP',500,3000]],ob:['yo','jugadorRival']},
 ganarXp:{n:'Ganar XP',p:[['n','XP',100,500]],ob:['yo']},
 destruir:{n:'Destruir',p:[],ob:['monstruoMio','monstruoRival','monstruoCampo','cartaCampoRival','atacante']},
 devolverMano:{n:'Devolver a la mano',p:[],ob:['monstruoRival','monstruoCampo','cartaCampoRival','atacante']},
 cambiarPosicion:{n:'Cambiar posición',p:[],ob:['esteMonstruo','monstruoMio','todosMisMonstruos','monstruoCampo','monstruoRival','atacante']},
 negarAtaque:{n:'Negar ataque',p:[],ob:['atacante']},
 fijarNivel0:{n:'Fijar Nivel en 0',p:[],ob:MON_OBJ,dur:1},
 nivelExtra:{n:'Nivel extra por batalla',p:[['n','Nivel extra',100,500]],ob:['esteMonstruo'],pas:1},
 mitadDano:{n:'Reducir daño a la mitad',p:[],ob:['yo'],pas:1},
 pasarSobrante:{n:'Pasar daño sobrante',p:[],ob:['jugadorRival']}};
const NIVEL_BATALLA=100;

/* ---- texto ---- */
const T_SUJ={esteMonstruo:'este monstruo',monstruoMio:'un monstruo tuyo',todosMisMonstruos:'todos tus monstruos',monstruoRival:'un monstruo rival',monstruoCampo:'un monstruo del campo',cartaCampoRival:'una carta del campo rival',atacante:'el atacante',yo:'tú',jugadorRival:'el rival'};
const T_DUR={finDelTurno:' hasta el final del turno',proxTurno:' hasta tu próximo turno',finProxTurno:' hasta el final de tu próximo turno'};
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
function ventTxt(vs){const riv=[],own=[];vs.forEach(v=>{if(v==='ataque')riv.push('ataca');else if(v==='invocacion')riv.push('invoca');else if(v==='finTurno')riv.push('termina su turno');else if(v==='dano')own.push('recibes daño')});
 const j=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' o '+a[a.length-1];
 const parts=[];if(riv.length)parts.push('el rival '+j(riv));if(own.length)parts.push(own[0]);return'Cuando '+parts.join(', o cuando ')}
function condTxt(c){if(!c)return'';switch(c.tipo){case'nivelMin':return`si su Nivel es ${c.n} o más`;case'aliadosMin':return`si controlas ${c.n} o más monstruos de su facción`;case'rivalTieneMas':return'si el rival controla más monstruos que tú';case'lpMax':return`si tienes ${c.n} LP o menos`;case'posicionVictima':return c.pos==='def'?'si el monstruo destruido estaba en defensa':'si el monstruo destruido estaba en ataque';case'manoMin':return`si tienes ${c.n} o más cartas en la mano`}return''}
function accTxt(e){const a=e.accion,o=e.objetivo,S=T_SUJ[o]||'';const st=a.stat==='def'?'DEF':'ATK';switch(a.tipo){
 case'robar':return`robas ${a.n} carta${a.n>1?'s':''}`;
 case'cambiarStat':{const sub=cap1(S);if(a.porNivel){const k=Math.abs(a.valor);return`${S} ${a.valor<0?'pierde':'gana'} ${st} igual a ${k===1?'su Nivel':k+' veces su Nivel'}`}return`${S} ${a.valor<0?'pierde '+Math.abs(a.valor):'gana +'+a.valor} ${st}`}
 case'sinergiaStat':return`+${a.por} ${st} por cada otro monstruo de tu facción en tu campo (máx. +${a.max})`;
 case'infligirDano':return o==='yo'?`pierdes ${a.n} LP`:`el rival pierde ${a.n} LP`;
 case'curar':return o==='yo'?`recuperas ${a.n} LP`:`el rival recupera ${a.n} LP`;
 case'ganarXp':return`ganas ${a.n} XP (hasta el tope actual)`;
 case'destruir':return`destruyes ${S}`;
 case'devolverMano':return`devuelves ${S} a la mano de su dueño`;
 case'cambiarPosicion':return o==='todosMisMonstruos'?'cambias la posición de todos tus monstruos':`cambias la posición de ${S}`;
 case'negarAtaque':return'niegas el ataque actual';
 case'fijarNivel0':return`${S} tiene Nivel 0`;
 case'nivelExtra':return`aprende rápido: gana +${a.n} de Nivel extra por batalla`;
 case'mitadDano':return'el daño de batalla que recibes se reduce a la mitad';
 case'pasarSobrante':return'el daño sobrante pasa al rival'}return''}
/* conCosto: los monstruos muestran su costo en el texto; las Acciones y Reacciones lo muestran aparte */
function textoEfecto(e,conCosto){if(!e)return'';const D=e.disparador||{},t=D.tipo;
 if(t==='alDestruirEnBatalla'&&e.accion&&e.accion.tipo==='pasarSobrante'&&e.condicion&&e.condicion.tipo==='posicionVictima'&&e.condicion.pos==='def'&&!(e.alternativas&&e.alternativas.length))return'Perforación: cuando ataca a un monstruo en defensa con DEF menor que su ATK, el rival pierde LP igual a la diferencia.'+(e.limite==='unaVezTurno'?' (1 vez por turno)':e.limite==='unaVezDuelo'?' (1 vez por duelo)':'');
 let pre='';if(t==='alInvocar')pre='Al ser invocado';else if(t==='alAtacar')pre='Cuando ataca';else if(t==='alSerAtacado')pre='Cuando es atacado';else if(t==='alDestruirEnBatalla')pre=e.condicion&&e.condicion.tipo==='posicionVictima'?(e.condicion.pos==='def'?'Si destruye un monstruo en defensa':'Si destruye un monstruo en ataque'):'Si destruye un monstruo en batalla';else if(t==='alRecibirDano')pre='Cuando recibes daño';else if(t==='finMiTurno')pre='Al final de tu turno';else if(t==='ventana')pre=ventTxt(D.ventanas||[]);
 const lim=e.limite;if(lim==='unaVezTurno')pre=(pre?pre+', ':'')+'1 vez por turno';else if(lim==='unaVezDuelo')pre=(pre?pre+', ':'')+'1 vez por duelo';
 const cond=t==='alDestruirEnBatalla'&&e.condicion&&e.condicion.tipo==='posicionVictima'?'':condTxt(e.condicion);
 let cost='';if(conCosto&&e.costo&&e.costo.tipo==='gastarNivel')cost=`gasta ${e.costo.n} de su Nivel para que `;
 const alts=e.alternativas&&e.alternativas.length?e.alternativas.map(x=>accTxt({...e,...x})):null;
 let body=alts?'elige una: '+alts.join('; o '):accTxt(e);
 if(DUR_LIM.includes(lim))body+=T_DUR[lim];
 if(cost)body=body.replace(/^recuperas/,'recuperes');
 body=(cost+body).trim();if(cond)body=cond+', '+body;
 return (pre?cap1(pre)+': '+body:cap1(body))+'.'}
const costoCarta=c=>!c||c.tipo==='ninguno'?null:c.tipo==='lp'?{t:'lp',v:c.n}:c.tipo==='xp'?{t:'xp',v:c.n}:c.tipo==='descartar'?{t:'disc',v:c.n}:{t:'lvl',v:c.n};

/* ---- compilar: sanea un efecto del JSON; devuelve null si no se puede usar ---- */
const _int=(v,a,b,d)=>{v=+v;return Number.isFinite(v)?Math.min(b,Math.max(a,Math.round(v))):d};
function compilarEfecto(x){
 if(!x||typeof x!=='object')return null;
 const D=x.disparador;if(!D||!V_TRIG[D.tipo])return null;
 const dsp={tipo:D.tipo};if(D.tipo==='ventana')dsp.ventanas=(Array.isArray(D.ventanas)?D.ventanas:[]).filter(v=>VENT[v]);
 const A=x.accion;if(!A||!V_ACC[A.tipo])return null;
 const ac={tipo:A.tipo};V_ACC[A.tipo].p.forEach(([k,,def,max])=>{ac[k]=_int(A[k],0,max,def)});
 if(A.tipo==='cambiarStat'||A.tipo==='sinergiaStat')ac.stat=A.stat==='def'?'def':'atk';
 if(A.tipo==='cambiarStat'){ac.valor=_int(A.valor,-3000,3000,0);if(A.porNivel)ac.porNivel=true}
 const C=x.costo||{tipo:'ninguno',n:0};const co={tipo:V_COSTO[C.tipo]?C.tipo:'ninguno',n:_int(C.n,0,5000,0)};
 let cd=null;if(x.condicion&&V_COND[x.condicion.tipo]){cd={tipo:x.condicion.tipo};V_COND[x.condicion.tipo].p.forEach(k=>{cd[k]=k==='pos'?(x.condicion.pos==='atk'?'atk':'def'):_int(x.condicion[k],0,9999,0)})}
 const e={disparador:dsp,condicion:cd,costo:co,objetivo:V_OBJ[x.objetivo]?x.objetivo:'yo',accion:ac,limite:LIM_ES[x.limite]?x.limite:'ninguno'};
 if(Array.isArray(x.alternativas)&&x.alternativas.length){e.alternativas=x.alternativas.slice(0,4).map(a=>{const r={etiqueta:String(a.etiqueta||'Opción').slice(0,40)};
  if(a.objetivo&&V_OBJ[a.objetivo])r.objetivo=a.objetivo;if(a.accion){const c=compilarEfecto({...x,alternativas:undefined,accion:a.accion});if(c)r.accion=c.accion}return r})}
 return e}

/* ---- validación de un efecto (ya compilado o crudo): devuelve [{lvl,msg}] ---- */
function validarEfecto(x,esMonstruo,perm){
 const I=[],E=m=>I.push({lvl:'e',msg:m}),W=m=>I.push({lvl:'w',msg:m});
 if(!x||typeof x!=='object'){E('El efecto no es un objeto.');return I}
 if(!x.disparador||!V_TRIG[x.disparador.tipo]){E('Disparador desconocido.');return I}
 if(!x.accion||!V_ACC[x.accion.tipo]){E('Acción desconocida.');return I}
 const T=V_TRIG[x.disparador.tipo],A=V_ACC[x.accion.tipo];
 if(esMonstruo&&!T.mon)E(`El disparador "${T.n}" es solo para Acciones y Reacciones.`);
 if(!esMonstruo&&!T.carta)E(`El disparador "${T.n}" es solo para monstruos.`);
 if(x.disparador.tipo==='ventana'&&!(x.disparador.ventanas||[]).filter(v=>VENT[v]).length)E('Elige al menos una ventana del rival.');
 const alts=Array.isArray(x.alternativas)&&x.alternativas.length?x.alternativas.map(a=>({...x,...a,accion:a.accion?{...x.accion,...a.accion}:x.accion})):[x];

const val=c=>isM(c)?c.d.at+c.d.df*.6+c.d.sac*500:(c.d.type==='A'?1800:2000);
function log(t,h){G.log.push({t,h});if(G.log.length>120)G.log.shift()}
const byUid=u=>{for(const p of G.pl)for(const c of [...p.hand,...p.mons,...p.zones,...p.grave])if(c&&c.uid===u)return c;return G.field&&G.field.uid===u?G.field:null};
function expire(ph){G.pl.forEach(p=>[...p.mons,...p.zones].forEach(c=>{if(c)c.mods=c.mods.filter(m=>!(m.until.phase===ph&&m.until.turn<=G.turn))}))}

function buildDeck(fi,o){const a=[];MONS.filter(d=>d.fi===fi).forEach(d=>{for(let i=0;i<d.copies;i++)a.push(mk(d,o))});SP.filter(d=>d.fi<0||d.fi===fi).forEach(d=>{for(let i=0;i<d.copies;i++)a.push(mk(d,o))});return shuffle(a)}
function buildRec(cards,o){const a=[];cards.forEach(({d,n})=>{for(let i=0;i<n;i++)a.push(mk(d,o))});return shuffle(a)}
function startGame(f0,f1,sim,rec){
 GEN++;FX.clear();CH.clear();
 const mkp=(i,f,ai,name,rc)=>({i,name,ai,fi:f,lp:CFG.lp,xp:0,hand:[],deck:rc?buildRec(rc,i):buildDeck(f,i),grave:[],mons:Array(5).fill(null),zones:Array(3).fill(null),summoned:false});
 G={field:null,rec:sim?null:rec,pl:[mkp(0,f0,sim,sim?'IA A':'Tú',sim?null:rec),mkp(1,f1,true,sim?'IA B':'Rival')],turn:0,cur:0,first:Math.random()<.5?0:1,phase:'main',over:null,log:[],round:1,sim};
 G.pl.forEach(p=>{for(let i=0;i<CFG.hand0;i++)p.hand.push(p.deck.pop())});
 UI.sel=null;UI.speed=window.__fast?0:(sim?650:550);
 $('#menu').hidden=true;$('#game').hidden=false;
 Snd.moodReset();Snd.music('calm');UI.hand=true;FX.snd('shuffle');return act(async()=>{if(!sim&&!window.__fast)G.first=await rollFirst();log(`${G.pl[G.first].name} empieza.`,1);await beginTurn()});
}
function joinHand(p,c){p.hand.push(c);for(let i=p.hand.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p.hand[i],p.hand[j]]=[p.hand[j],p.hand[i]]}if(!p.ai){UI.shuf=Date.now();setTimeout(()=>FX.snd('shuffle'),260)}}
function draw(p,n,lose){for(let i=0;i<n;i++){if(!p.deck.length){if(lose&&!G.over)endGame(1-p.i,`${p.name} no tiene cartas para robar.`);return}joinHand(p,p.deck.pop())}}
function endGame(w,why){if(G.over)return;G.over={w,why};log(why,1);render();const p=G.pl[w];
 modal(`<h3>${w===-1?'Empate':(p.name+' gana el duelo')}</h3><p>${why}</p><div class="mbtns"><button class="pri" data-m="again">Revancha</button><button data-m="menu">Menú</button></div>`).then(v=>{if(v==='again')startGame(G.pl[0].fi,G.pl[1].fi,G.sim,G.rec);else toMenu()})}
async function beginTurn(){
 G.turn++;G.cur=(G.first+G.turn-1)%2;G.round=Math.ceil(G.turn/2);G.phase='main';
 expire('start');const p=cur();p.summoned=false;
 p.mons.forEach(m=>{if(m){m.boost=null;m.ub=false;m.uh=false;m.att=false;m.pc=false}});
 log(`Turno ${G.turn} · ${p.name}`,1);
 render();await FX.banner(`Turno ${G.turn} · ${p.name}`,'Fase principal');
 if(G.turn>1){await FX.draw(p);draw(p,1,true)}
 render();
 if(!G.over&&p.ai)await aiTurn();
}
const PH={main:'Fase principal',battle:'Fase de batalla',end:'Fase final'};
async function goPhase(ph){if(G.over||G.phase===ph)return;G.phase=ph;log(PH[ph]+'.');render();await FX.banner(PH[ph],ph==='end'?'Juega Acciones o coloca Reacciones antes de ceder el turno':'')}
async function endTurn(){
 if(G.over)return;const p=cur(),o=opp();G.phase='end';render();
 for(const m of p.mons.filter(Boolean)){await fireMon(m,'finMiTurno',{});if(G.over)return}
 await react('endTurn',{});if(G.over)return;
 if(p.hand.length>CFG.handMax){const n=p.hand.length-CFG.handMax;let ch;
  if(p.ai)ch=[...p.hand].sort((a,b)=>val(a)-val(b)).slice(0,n);else ch=await pickCards(`Mano llena: descarta ${n} carta(s)`,p.hand,n,n,{nocancel:1});
  ch.forEach(x=>{p.hand.splice(p.hand.indexOf(x),1);p.grave.push(x)});log(`${p.name} descarta ${n} por límite de mano.`)}
 expire('end');render();await sleep(UI.speed/2);await beginTurn();
}
async function hurt(pi,amt,kind){
 if(G.over||amt<=0)return;const p=G.pl[pi];
 if(kind==='battle'&&p.mons.some(m=>m&&pasiva(m,'mitadDano')))amt=Math.floor(amt/2);
 p.lp=Math.max(0,p.lp-amt);log(`${p.name} pierde ${amt} LP.`);FX.hud(pi,'−'+amt,'dmg');
 if(p.lp<=0){endGame(1-pi,`${p.name} se quedó sin puntos de vida.`);return}
 for(const m of p.mons.filter(Boolean)){await fireMon(m,'alRecibirDano',{amt});if(G.over)return}
 if(pi!==G.cur)await react('damage',{amt});
}
const gainXP=p=>{const b=p.xp;p.xp=Math.min(xpCap(),p.xp+CFG.xpGain);if(p.xp>b)FX.hud(p.i,'+'+(p.xp-b)+' XP','xp',1)};
const gainNivel=c=>{const b=c.nivel;c.nivel=Math.min(c.d.cap,c.nivel+c.d.speed);if(c.nivel>b)FX.mark(c,{k:'lv',amt:c.nivel-b})};
const snap=c=>({a:eATK(c),d:eDEF(c)});
function statFx(c,b){if(!FX.on())return;const a=snap(c);if(a.a!==b.a)FX.mark(c,{k:'stat',st:'atk',from:b.a,to:a.a});if(a.d!==b.d)FX.mark(c,{k:'stat',st:'def',from:b.d,to:a.d})}
function dropEq(c,p){p.zones.forEach((z,i)=>{if(z&&z.eq===c.uid){p.zones[i]=null;resetC(z);p.grave.push(z);log(`${z.d.name} se destruye junto a ${c.d.name}.`)}})}
function destroy(c){FX.ghost(c,'boom');const p=G.pl[c.o];const i=p.mons.indexOf(c);if(i>=0)p.mons[i]=null;const z=p.zones.indexOf(c);if(z>=0)p.zones[z]=null;dropEq(c,p);resetC(c);p.grave.push(c)}
function bounce(c){FX.ghost(c,'up');const p=G.pl[c.o];const i=p.mons.indexOf(c);if(i>=0)p.mons[i]=null;const z=p.zones.indexOf(c);if(z>=0)p.zones[z]=null;dropEq(c,p);resetC(c);joinHand(p,c)}
const inField=c=>G.pl[c.o].mons.includes(c);
const canAttack=c=>inField(c)&&c.pos==='atk'&&!c.att&&G.turn>1;

/* costos */
function canPay(p,c,ex){if(c.t==='lp')return p.lp>c.v;if(c.t==='xp')return p.xp>=c.v;return p.hand.filter(x=>x!==ex).length>=c.v}
async function payCost(p,c,ex){
 if(c.t==='lp'){p.lp-=c.v;log(`${p.name} paga ${c.v} LP.`);return true}
 if(c.t==='xp'){p.xp-=c.v;log(`${p.name} gasta ${c.v} XP.`);return true}
 const pool=p.hand.filter(x=>x!==ex);let ch;
 if(p.ai)ch=[...pool].sort((a,b)=>val(a)-val(b)).slice(0,c.v);
 else{ch=await pickCards(`Descarta ${c.v} carta(s) para pagar`,pool,c.v,c.v);if(!ch)return false}
 ch.forEach(x=>{p.hand.splice(p.hand.indexOf(x),1);p.grave.push(x)});log(`${p.name} descarta ${ch.length} carta(s).`);return true;
}

/* invocación */
function summonInfo(p,c){
 if(G.phase!=='main')return{ok:false,why:'Solo en la fase principal.'};
 if(p.summoned)return{ok:false,why:'Ya invocaste este turno.'};
 const n=c.d.sac;const pool=p.mons.filter(m=>m&&m.d.fac===c.d.fac);
 if(n>0){const tot=pool.reduce((a,m)=>a+sacVal(m),0);if(tot<n)return{ok:false,why:`Necesita ${n} sacrificio(s) de ${FAC[c.d.fi].n} en tu campo (un veterano con Nivel ${CFG.vetNivel}+ vale ${CFG.vetValue}).`,pool}}
 else if(!p.mons.includes(null))return{ok:false,why:'Campo lleno.'};
 return{ok:true,pool};
}
function aiPickSacs(pool,n){const s=[...pool].sort((a,b)=>(a.nivel+a.d.at/10)-(b.nivel+b.d.at/10));const sel=[];let t=0;for(const m of s){if(t>=n)break;sel.push(m);t+=sacVal(m)}
 for(const m of [...sel])if(t-sacVal(m)>=n){sel.splice(sel.indexOf(m),1);t-=sacVal(m)}return sel}
async function doSummon(p,c,pos,presel){
 const s=summonInfo(p,c);if(!s.ok)return false;let sacs=[];
 if(c.d.sac>0){
  if(presel)sacs=presel;else if(p.ai)sacs=aiPickSacs(s.pool,c.d.sac);
  else{sacs=await pickCards(`Sacrificios para invocar a ${c.d.name} (necesitas ${c.d.sac})`,s.pool,1,5,{valid:sel=>sacOK(sel,c.d.sac),info:sel=>`Valor ${sel.reduce((a,m)=>a+sacVal(m),0)} / ${c.d.sac}`,cap:m=>sacVal(m)>1?'vale 2':'vale 1'});if(!sacs)return false}
 }
 const from=FX.fromHand(p,c);
 sacs.forEach(m=>destroy(m));if(sacs.length){render();await FX.settle()}
 p.hand.splice(p.hand.indexOf(c),1);const i=p.mons.indexOf(null);p.mons[i]=c;
 c.pos=pos;c.pc=true;c.st=G.turn;c.o=p.i;p.summoned=true;
 log(`${p.name} invoca a ${c.d.name} en ${pos==='atk'?'ataque':'defensa'}${sacs.length?` sacrificando a ${sacs.map(m=>m.d.name).join(', ')}`:''}.`);
 render();await FX.land(c,from);
 await fireMon(c,'alInvocar',{});
 await FX.settle();await react('summon',{card:c});return true;
}
async function doSet(p,c){const from=FX.fromHand(p,c);const i=p.zones.indexOf(null);p.hand.splice(p.hand.indexOf(c),1);p.zones[i]=c;c.o=p.i;log(`${p.name} coloca una carta boca abajo.`);render();await FX.land(c,from)}

/* ===== intérprete de efectos ===== */
const PICK=['monstruoMio','monstruoRival','monstruoCampo','cartaCampoRival'];
const PICKMSG={monstruoMio:'Elige un monstruo tuyo',monstruoRival:'Elige un monstruo rival',monstruoCampo:'Elige un monstruo del campo',cartaCampoRival:'Elige una carta rival'};
const efAlt=(e,i)=>{const x=e.alternativas&&i!=null?e.alternativas[i]:null;return x?{...e,...x}:e};
const flip=m=>{const f=m.pos==='atk'?0:90;m.pos=m.pos==='atk'?'def':'atk';FX.mark(m,{k:'pos',from:f,to:90-f})};
function cumple(c,src,ctx){if(!c)return true;const p=G.pl[src.o],o=G.pl[1-src.o];switch(c.tipo){
 case'nivelMin':return src.nivel>=c.n;case'aliadosMin':return allies(src).length>=c.n;
 case'rivalTieneMas':return o.mons.filter(Boolean).length>p.mons.filter(Boolean).length;
 case'lpMax':return p.lp<=c.n;case'posicionVictima':return !!ctx&&ctx.victimPos===c.pos;case'manoMin':return p.hand.length>=c.n}return true}
function durUntil(lim,ap){const t=ap.i===G.cur?G.turn+2:G.turn+1;return lim==='finDelTurno'?{turn:G.turn,phase:'end'}:lim==='proxTurno'?{turn:t,phase:'start'}:{turn:t,phase:'end'}}
/* cartas entre las que se puede elegir (o [1] si el objetivo no se elige) */
function posibles(ap,e,ctx){const rv=G.pl[1-ap.i];switch(e.objetivo){
 case'monstruoMio':return ap.mons.filter(Boolean);
 case'monstruoRival':return rv.mons.filter(Boolean);
 case'monstruoCampo':return[...ap.mons,...rv.mons].filter(Boolean);
 case'cartaCampoRival':return[...rv.mons,...rv.zones].filter(Boolean);
 case'atacante':return ctx&&ctx.attacker&&inField(ctx.attacker)?[ctx.attacker]:[];
 case'todosMisMonstruos':return ap.mons.some(Boolean)?[1]:[];
 default:return[1]}}
const actTargets=(p,d)=>{const e=d.ef;let L=e.alternativas?e.alternativas.flatMap((a,i)=>posibles(p,efAlt(e,i),null)):posibles(p,e,null);if(d.perm==='equip'&&d.fi>=0)L=L.filter(m=>m.d&&m.d.fi===d.fi);return L};
async function resolver(e,src,ap,ctx,prm){
 const a=e.accion,rv=G.pl[1-ap.i],t=prm&&prm.t,pl=e.objetivo==='yo'?ap:rv;
 const cards=()=>{switch(e.objetivo){case'esteMonstruo':return[src];case'todosMisMonstruos':return ap.mons.filter(Boolean);case'atacante':return ctx&&ctx.attacker?[ctx.attacker]:[];default:return t?[t]:[]}};
 const nm=x=>x.d&&x.d.name||'Carta';
 switch(a.tipo){
  case'robar':for(let i=0;i<a.n;i++){await FX.draw(ap);draw(ap,1)}log(`${src.d.name}: ${ap.name} roba ${a.n} carta${a.n>1?'s':''}.`);render();break;
  case'cambiarStat':for(const x of cards()){const b=snap(x);const amt=a.porNivel?a.valor*eN(x):a.valor;x.mods.push({stat:a.stat,amt,until:durUntil(e.limite,ap)});statFx(x,b);log(`${nm(x)} ${amt<0?'pierde '+(-amt):'gana '+amt} ${a.stat.toUpperCase()}.`)}break;
  case'infligirDano':log(`${src.d.name}: ${pl.name} pierde ${a.n} LP.`);await hurt(pl.i,a.n,'fx');break;
  case'curar':{const b=pl.lp;pl.lp=Math.min(CFG.lp,pl.lp+a.n);log(`${pl.name} recupera ${pl.lp-b} LP.`);FX.hud(pl.i,'+'+(pl.lp-b),'heal');break}
  case'ganarXp':{const b=ap.xp;ap.xp=Math.min(xpCap(),ap.xp+a.n);log(`${ap.name} gana ${ap.xp-b} XP.`);FX.hud(ap.i,'+'+(ap.xp-b)+' XP','xp',1);break}
  case'destruir':for(const x of cards()){log(`${nm(x)} es destruida.`);destroy(x)}break;
  case'devolverMano':for(const x of cards()){log(`${nm(x)} vuelve a la mano.`);if(ctx&&(x===ctx.attacker||x===ctx.card))ctx.cancelled=true;bounce(x)}break;
  case'cambiarPosicion':cards().forEach(flip);log('Cambian posiciones de batalla.');break;
  case'negarAtaque':if(ctx){ctx.cancelled=true;FX.lockFx(ctx.attacker);FX.mark(ctx.attacker,{k:'pulse',label:'¡Ataque negado!'})}break;
  case'fijarNivel0':for(const x of cards()){const b=snap(x);x.mods.push({stat:'nivel0',amt:0,until:durUntil(e.limite,ap)});statFx(x,b);log(`${nm(x)} tiene Nivel 0.`)}break;
  case'pasarSobrante':log(`${src.d.name} perfora la defensa.`);await hurt(rv.i,ctx.exceso,'battle');break}}
/* efecto de monstruo con disparador (alInvocar, alSerAtacado, alDestruirEnBatalla, finMiTurno) */
const CH=new Set(); /* cartas cuyo efecto se está resolviendo: una carta no puede encadenar su efecto dos veces */
const LBL={robar:'Roba una carta',infligirDano:'Daño',pasarSobrante:'Perfora',curar:'Cura'};
async function fireMon(src,trig,ctx){const e=disp(src,trig);if(!e||CH.has(src.uid))return false;
 if(!cumple(e.condicion,src,ctx))return false;
 if(e.limite==='unaVezTurno'&&src.ut===G.turn)return false;if(e.limite==='unaVezDuelo'&&src.ud)return false;
 if(e.limite==='unaVezTurno')src.ut=G.turn;if(e.limite==='unaVezDuelo')src.ud=true;
 CH.add(src.uid);
 try{FX.mark(src,{k:'pulse',label:LBL[e.accion.tipo]||(V_ACC[e.accion.tipo]||{}).n||''});render();await FX.settle();
  await resolver(e,src,G.pl[src.o],ctx,{})}finally{CH.delete(src.uid)}
 return true}
/* efecto manual de un monstruo (por ejemplo, curar gastando Nivel) */
function manualInfo(p,c){const e=disp(c,'manual');if(!e)return null;
 const used=(e.limite==='unaVezTurno'&&c.ut===G.turn)||(e.limite==='unaVezDuelo'&&c.ud)||CH.has(c.uid),lvl=e.costo.tipo==='gastarNivel'&&c.nivel<e.costo.n;
 const full=e.accion.tipo==='curar'&&e.objetivo==='yo'&&p.lp>=CFG.lp;
 return{e,ok:!used&&!lvl&&!full,why:used?'Ya lo usaste.':lvl?'Nivel insuficiente.':full?'LP al máximo.':''}}
async function activarMon(p,c){const m=manualInfo(p,c);if(!m||!m.ok)return;const e=m.e;
 if(e.costo.tipo==='gastarNivel'){c.nivel-=e.costo.n;log(`${c.d.name} gasta ${e.costo.n} Nivel.`)}
 if(e.limite==='unaVezTurno')c.ut=G.turn;if(e.limite==='unaVezDuelo')c.ud=true;
 CH.add(c.uid);try{FX.mark(c,{k:'pulse',label:LBL[e.accion.tipo]||''});await resolver(e,c,p,{},{})}finally{CH.delete(c.uid)}}

/* acciones */
async function askParams(p,d){let e=d.ef,alt=null;
 if(e.alternativas){const ch=await choice(d.name,e.alternativas.map((a,i)=>[String(i),a.etiqueta]));if(ch==null)return null;alt=+ch;e=efAlt(e,alt)}
 const prm={alt};
 if(PICK.includes(e.objetivo)){const t=await pickTarget(PICKMSG[e.objetivo],posibles(p,e,null).filter(m=>!(d.perm==='equip'&&d.fi>=0&&m.d&&m.d.fi!==d.fi)));if(!t)return null;prm.t=t}
 return prm}
async function playAction(p,c,prm){
 const d=c.d;if(!prm){prm=await askParams(p,d);if(!prm)return false}
 if(!canPay(p,d.cost,c))return false;
 if(d.perm&&!p.zones.includes(null))return false;
 if(!(await payCost(p,d.cost,c)))return false;
 if(d.perm){const from=FX.fromHand(p,c);p.hand.splice(p.hand.indexOf(c),1);const i=p.zones.indexOf(null);p.zones[i]=c;c.o=p.i;c.up=true;
  if(d.perm==='equip'&&prm.t){FX.snd('equip');c.eq=prm.t.uid;log(`${p.name} equipa ${d.name} a ${prm.t.d.name}.`)}else log(`${p.name} deja ${d.name} en su zona.`);
  const b=prm.t&&snap(prm.t);render();await FX.land(c,from);if(b)statFx(prm.t,b);render();await FX.settle();return true}
 p.hand.splice(p.hand.indexOf(c),1);p.grave.push(c);log(`${p.name} juega ${d.name}.`);render();await FX.pop(c);
 await resolver(efAlt(d.ef,prm.alt),c,p,{},prm);
 render();await FX.settle();return true;
}

async function playField(p,c){
 if(G.phase!=='main'||!canPay(p,c.d.cost,c))return false;
 if(!(await payCost(p,c.d.cost,c)))return false;
 const from=FX.fromHand(p,c);p.hand.splice(p.hand.indexOf(c),1);
 if(G.field){const old=G.field;G.field=null;resetC(old);G.pl[old.o].grave.push(old);log(`${old.d.name} sale del campo.`)}
 c.o=p.i;c.up=true;G.field=c;log(`${p.name} juega el campo ${c.d.name}.`);render();FX.snd('field');await FX.land(c,from);render();await FX.settle();return true}

/* combate */
async function doAttack(att,tgt){
 const me=cur(),op=opp();att.att=true;
 log(`${att.d.name} (${eATK(att)} ATK) ataca ${tgt?'a '+tgt.d.name:'directamente'}.`);
 const ctx={attacker:att,target:tgt,cancelled:false};
 render();await FX.attack(att,tgt);await fireMon(att,'alAtacar',{attacker:att,target:tgt});if(G.over)return;await react('attack',ctx);if(G.over)return;
 if(ctx.cancelled||!inField(att)){log('El ataque no se realiza.');render();return}
 if(!tgt){const dmg=eATK(att);gainNivel(att);gainXP(op);await hurt(op.i,dmg,'battle');render();await FX.settle();return}
 const a=eATK(att);let killed=false,attDead=false;
 await fireMon(tgt,'alSerAtacado',{attacker:att});if(G.over)return
 let vp='atk',exc=0;
 if(tgt.pos==='atk'){const d=eATK(tgt);
  if(a>d){destroy(tgt);killed=true;await hurt(op.i,a-d,'battle')}
  else if(a<d){destroy(att);attDead=true;await hurt(me.i,d-a,'battle')}
  else if(a>=CFG.tieAtk){destroy(tgt);destroy(att);attDead=true;killed=true;log(`Empate a ${a} ATK (${CFG.tieAtk} o más): ambos monstruos son destruidos.`)}
  else log(`Empate a ${a} ATK: ningún monstruo se destruye.`)
 }else{const d=eDEF(tgt);vp='def';
  if(a>d){destroy(tgt);killed=true;exc=a-d}
  else if(a<d){await hurt(me.i,d-a,'battle')}else log('Sin daño.')}
 if(G.over)return;
 if(killed)await fireMon(att,'alDestruirEnBatalla',{victimPos:vp,exceso:exc,victim:tgt});
 else if(attDead&&inField(tgt))await fireMon(tgt,'alDestruirEnBatalla',{victimPos:'atk',victim:att});
 if(G.over)return;
 if(inField(att))gainNivel(att);if(inField(tgt))gainNivel(tgt);
 render();await FX.settle();
}

/* reacciones */
function rOK(z,win,ctx,p){const e=z.d.ef,me=G.pl[1-p.i];
 switch(e.objetivo){
  case'atacante':if(!(win==='attack'&&me.mons.includes(ctx.attacker)))return false;break;
  case'monstruoRival':if(!me.mons.some(Boolean))return false;break;
  case'monstruoCampo':if(![...p.mons,...me.mons].some(Boolean))return false;break;

async function react(win,ctx){
 for(let g=0;g<3;g++){
  if(G.over||ctx.cancelled)return;const p=opp();
  const all=p.zones.filter(z=>z&&z.d.type==='R'&&z.d.windows.includes(win)&&!(z.d.perm&&z.ut===G.turn)&&rOK(z,win,ctx,p));

  if(!opts.length)return;

function aiTarget(z,win,ctx,me,opts){const id=z.d.id;
 if(id==='R2')return [...opts].sort((a,b)=>(b.pos==='def')-(a.pos==='def')||eN(b)-eN(a))[0];

  tgt=p.ai?aiTarget(z,win,ctx,me,opts):await pickTarget(`${z.d.name}: ${PICKMSG[e.objetivo]}`,opts);if(!tgt)return}
 if(!(await payCost(p,z.d.cost,null)))return;
 if(z.d.perm){z.up=true;z.ut=G.turn}else{p.zones[p.zones.indexOf(z)]=null;p.grave.push(z)}log(`${p.name} activa ${z.d.name}.`,0);render();await FX.pop(z);

function aiR4(win,ctx,me){const ms=me.mons.filter(Boolean);
 if(win==='attack'&&me.mons.includes(ctx.attacker))return ctx.attacker;

 return ms.sort((a,b)=>val(b)-val(a))[0]||me.zones.find(Boolean)}
function aiReact(p,opts,win,ctx){
 const me=cur(),has=id=>opts.find(z=>z.d.id===id),att=ctx.attacker,tg=ctx.target;
 const r3=has('R3');if(r3&&win==='attack'){
  if(!tg){if(eATK(att)>=1500||p.lp<=eATK(att)*2)return r3}
  else if(tg.pos==='atk'?eATK(att)>=eATK(tg):eATK(att)>eDEF(tg))return r3}
 const r1=has('R1');if(r1&&win==='attack'&&att.boost==='atk'&&eN(att)>=300){
  const base=eATK(att)-eN(att);
  if(!tg||(tg.pos==='atk'?(eATK(att)>=eATK(tg)&&base<eATK(tg)):(eATK(att)>eDEF(tg)&&base<=eDEF(tg))))return r1}
 const r4=has('R4');if(r4&&p.hand.length>=3){
  if(win==='attack'&&eATK(att)>=2500)return r4;
  if(win==='summon'&&ctx.card.d.sac>=2)return r4;
  if(win==='endTurn'&&me.mons.some(m=>m&&m.d.sac>=3))return r4}
 const r5=has('R5');if(r5&&p.lp<=5000)return r5;
 const r2=has('R2');if(r2&&win==='endTurn'&&me.mons.some(m=>m&&m.pos==='def'&&eN(m)>=200))return r2;
 for(const z of opts){if(/^R[1-5]$/.test(z.d.id))continue;const ac=z.d.ef.accion.tipo;
  if(ac==='negarAtaque'&&win==='attack'&&(att&&eATK(att)>=1500||p.lp<=5000))return z;

  if(ac==='robar'&&p.hand.length<=3)return z;if(ac==='infligirDano'&&win!=='damage')return z}
 return null}

function rules(){return modal(`<h3>Reglas de este prototipo</h3><div class="rtxt">
<h4>Cómo se gana</h4><ul><li>Llevas a 0 los LP del rival. Cada jugador empieza con 8000 y ese es su tope. Quien no puede robar al empezar su turno pierde (supuesto).</li></ul>
<h4>Fases del turno</h4><ul><li><b>Fase principal:</b> robas, invocas (1 por turno), colocas Reacciones, juegas Acciones, potencias y cambias posiciones.</li><li><b>Fase de batalla:</b> solo si tienes monstruos que puedan atacar. Cada uno ataca una vez.</li><li><b>Fase final:</b> puedes jugar Acciones y colocar más Reacciones. Luego cedes el turno.</li></ul><h4>Reacciones</h4><ul><li>Cada Reacción dice en qué momento se activa: cuando el rival ataca, cuando invoca, al final de su turno o cuando recibes daño. Esa oportunidad dura todo el turno del rival.</li><li>Cuando el momento llega y tienes una Reacción colocada que puedas pagar, el juego pregunta: <i>¿Activar carta de Reacción colocada?</i> Si dices Sí, tocas la que quieres. Si dices No, el turno sigue.</li><li>En un mismo momento se pueden encadenar hasta 3 Reacciones.</li></ul><h4>Turno</h4><ul><li>Robas 1 (quien empieza no roba en el primer turno). Mano inicial de 5, máximo 7 al terminar el turno.</li><li>Fase principal: 1 invocación por turno, colocar Reacciones, jugar Acciones, potenciar con Nivel, cambiar posición.</li><li>Fase de batalla: cada monstruo ataca una vez. Un monstruo puede atacar el mismo turno en que entra. Solo en el primer turno del duelo nadie ataca. Ataque directo solo si el rival no tiene monstruos.</li></ul>
<h4>Quién empieza</h4><ul><li>Cada jugador tira un dado de 6 caras. El mayor empieza primero (si empatan, se repite). En el marcador de cada jugador se ve si va PRIMERO o SEGUNDO.</li></ul>
<h4>Cartas que se quedan en la zona</h4><ul><li>Las 3 zonas de Acción/Reacción son compartidas por todo lo que se queda en juego, así que cada una que dejas ahí es una decisión.</li><li><b>Equipo:</b> se coloca boca arriba sobre uno de tus monstruos y le da un bono permanente. Si ese monstruo deja el campo (destruido o devuelto a la mano), el equipo va al cementerio.</li><li><b>Continua:</b> se queda boca arriba y da un bono a todos tus monstruos mientras siga en tu zona.</li><li><b>Reacción continua:</b> se coloca boca abajo como cualquier Reacción, pero después de activarse se queda en la zona (boca arriba) y puede volver a activarse, como máximo una vez por turno.</li></ul>
<h4>Carta de Campo</h4><ul><li>Hay una sola zona de campo, en la fila central del tablero, compartida por ambos jugadores. Se juega en tu fase principal pagando su costo. Si juegas otra, la anterior va al cementerio de quien la jugó.</li><li>Afecta a los monstruos de los dos lados según su facción: suele fortalecer a la facción de la carta y debilitar a las demás. La imagen de la carta queda de fondo del tablero. Los mazos solo incluyen la carta de campo de su facción.</li></ul>
<h4>Nivel del monstruo</h4><ul><li>El tope de Nivel son las estrellas ×100. Sacrificios: 1 a 4 estrellas ninguno, 5 y 6 uno, 7 y 8 dos, 9 a 12 tres.</li><li>Empieza en 0 y sube la velocidad del monstruo (+100 por defecto) cada vez que participa en una batalla, incluso un ataque directo, hasta su tope. Se pierde al salir del campo. Se ve como número en la esquina de su casilla.</li><li>Una vez por turno puedes potenciar un monstruo: suma su Nivel a ATK (en ataque) o a DEF (en defensa) hasta tu próximo turno. No gasta Nivel. En el campo cada carta muestra el stat de su posición: azul si está aumentado, rojo si está reducido.</li></ul>
<h4>XP del jugador</h4><ul><li>+100 por cada ataque directo recibido, hasta un tope compartido que empieza en ${CFG.xpCap0} (supuesto) y sube +${CFG.xpCapStep} cada 2 rondas. La XP se gasta. Cada punto del marcador son 100 XP.</li></ul>
<h4>Costos y recuperación</h4><ul><li>Cada carta paga con LP, descartes o XP (se ve en la carta). No puedes pagar un costo en LP que te deje en 0.</li><li>Los monstruos pesados se invocan sacrificando monstruos de su facción en tu campo. Un veterano (Nivel ${CFG.vetNivel}+) vale ${CFG.vetValue} (supuesto).</li><li>Cementerio (tócalo): recuperar un monstruo cuesta descartar de tu mano tantos monstruos de su facción como sacrificios pide (mínimo 1) y vuelve a la mano. Una Acción cuesta ${CFG.recActLP} LP. Una Reacción cuesta ${CFG.recReaXP} XP.</li></ul>
<h4>Combate</h4><ul><li>Ataque contra ataque: gana el mayor, la diferencia es daño. Si empatan, no se destruyen, salvo que el ATK sea ${CFG.tieAtk} o más: entonces ambos se destruyen. Contra defensa: si ATK supera DEF se destruye sin daño. Si DEF es mayor, quien ataca pierde la diferencia en LP.</li></ul></div><div class="mbtns"><button class="pri" data-m="x">Cerrar</button></div>`)}

 ms.forEach(add);for(const d of SP.filter(d=>d.fi<0||d.fi===fi)){if(tot>=REC_MIN)break;add(d)}

function recInfo(r){
 const idx=cardIdx();let n=0,mon=0,sp=0,miss=0;const cards=[];
 r.cards.forEach(c=>{const d=idx.get(c.id);const k=Math.max(0,Math.min(REC_COP,c.n|0));if(!d){miss+=k;return}n+=k;if(d.kind!==undefined)mon+=k;else sp+=k;if(k)cards.push({d,n:k})});
 const err=[],warn=[];
 if(n<REC_MIN)err.push(`Faltan ${REC_MIN-n} carta(s): mínimo ${REC_MIN}.`);
 if(n>REC_MAX)err.push(`Sobran ${n-REC_MAX} carta(s): máximo ${REC_MAX}.`);

 function mkGraph(c){

  const[a,id]=v.split(':');
  if(a==='ok'){applyMerged();renderMenu();const p=PACKS.find(x=>x.faccion.id===id);await modal(`<h3>Facción importada</h3><p><b>${esc(p.faccion.nombre||id)}</b> ya está en tu juego.${packLocked(p)?' Está bloqueada: pide la clave a quien la creó para usarla en tus recetas.':''}</p><div class="mbtns"><button class="pri" data-m="x">Aceptar</button></div>`)}
  else if(a==='del'){const p=PACKS.find(x=>x.faccion.id===id);if(!p)continue;
   const c=await modal(`<h3>Eliminar facción</h3><p>¿Quitar <b>${esc(p.faccion.nombre||id)}</b> de tu juego? Las recetas que usen sus cartas quedarán incompletas. Puedes volver a importarla después.</p><div class="mbtns"><button class="pri" data-m="si">Eliminar</button><button class="ghost" data-m="x">Cancelar</button></div>`);
   if(c==='si'){try{await PK.del(id)}catch(e){}PACKS=PACKS.filter(x=>x.faccion.id!==id);applyMerged();renderMenu()}}
  else if(a==='unl'){const p=PACKS.find(x=>x.faccion.id===id);if(!p)continue;let pw='';
   const c=await modal(`<h3>Desbloquear ${esc(p.faccion.nombre||id)}</h3><p class="mut">Escribe la clave que te dio quien creó esta facción.</p><input type="password" id="pkw" autocomplete="off" style="width:100%;padding:8px;font:inherit"><div class="mbtns"><button class="pri" data-m="ok">Desbloquear</button><button class="ghost" data-m="x">Cancelar</button></div>`,{init:box=>{const i=box.querySelector('#pkw');i.focus();i.oninput=()=>pw=i.value;i.onkeydown=e=>{if(e.key==='Enter')closeModal('ok')}}});
   if(c==='ok'){let h='';try{h=await sha256hex(p.clave.sal+pw)}catch(e){}
    if(h===p.clave.hash){const u=unlocks();u[id]=h;try{localStorage.setItem(UNLOCK_KEY,JSON.stringify(u))}catch(e){}applyMerged();renderMenu();await modal(`<h3>Desbloqueada</h3><p>Ya puedes usar sus cartas en tus recetas.</p><div class="mbtns"><button class="pri" data-m="x">Aceptar</button></div>`)}
    else await modal(`<h3>Clave incorrecta</h3><p>La facción sigue bloqueada.</p><div class="mbtns"><button class="pri" data-m="x">Aceptar</button></div>`)}}}}

/* ============ CARTAS: guardado, importación y vuelta al menú ============ */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toMenu(){Snd.ambient(null);Snd.moodReset();Snd.music('calm');GEN++;FX.clear();G=null;UI.sel=null;UI.target=null;UI.busy=false;UI.modal=null;UI.acts=[];
 const m=$('#modal');m.hidden=true;m.innerHTML='';$('#fmenu').hidden=true;$('#tbar').hidden=true;
 $('#game').hidden=true;$('#menu').hidden=false;
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
 try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
 renderMenu()}
function useCards(data,save){
 BASE_SET=data;applyMerged();UI.menu={me:0,op:-1};
 if(save===true){const ok=store.set('tcg.cartas',JSON.stringify(data));return ok}
 if(save===false)store.del('tcg.cartas');return true}
async function bootCards(){
 if(!DEFAULT_DATA&&typeof BASE_JSON==='string'){try{const r=await fetch(BASE_JSON,{cache:'no-cache'});if(!r.ok)throw new Error(r.status);DEFAULT_DATA=await r.json()}catch(e){$('#menu').innerHTML='<div style="padding:30px;text-align:center;color:#fff"><h2>No se pudieron cargar las cartas</h2><p>Abre el juego desde su página web (GitHub Pages) o con un servidor local. Si abres el archivo con doble clic, el navegador bloquea la lectura de <code>cartas/base.json</code>.</p></div>';return}}
 let data=DEFAULT_DATA;const raw=store.get('tcg.cartas');
 if(raw){try{const d=JSON.parse(raw),v=validateCards(d);if(!v.fatal&&!v.issues.some(i=>i.lvl==='e'))data=v.data}catch(e){}}
 BASE_SET=data;PACKS=await PK.all();applyMerged();renderMenu()}
async function cardsDialog(){
 let pending=null,again=true;
 while(again){again=false;pending=null;
  const v=await modal(`<h3>Cartas del juego</h3><p>Set actual: <b>${FAC.setName}</b> · ${FAC.length} facciones · ${MONS.length} monstruos.</p>
  <p class="mut">Prepara el archivo en el Taller de cartas. Usar un set nuevo reemplaza el actual (exporta antes del Taller si quieres conservarlo).</p>
  <div class="mrow"><label class="fileb">Elegir archivo .json<input type="file" id="cfile" accept=".json,application/json" hidden></label></div>
  <textarea id="ctext" rows="5" spellcheck="false" placeholder="…o pega aquí el contenido del JSON"></textarea>
  <div id="cmsg" class="cmsg mut">Todavía no hay nada cargado.</div>
  <div class="mbtns"><button class="pri" id="cok" data-m="apply" disabled>Usar este set</button><button data-m="reset">Volver al set original</button><button class="ghost" data-m="x">Cerrar</button></div>`,{init:box=>{
   const ta=box.querySelector('#ctext'),msg=box.querySelector('#cmsg'),ok=box.querySelector('#cok');
   const check=()=>{pending=null;ok.disabled=true;const t=ta.value.trim();if(!t){msg.className='cmsg mut';msg.textContent='Todavía no hay nada cargado.';return}
    let d;try{d=JSON.parse(t)}catch(e){msg.className='cmsg bad';msg.textContent='El texto no es un JSON válido: '+e.message;return}
    const r=validateCards(d);if(r.fatal){msg.className='cmsg bad';msg.innerHTML=r.fatal;return}
    const er=r.issues.filter(i=>i.lvl==='e'),wa=r.issues.filter(i=>i.lvl==='w');
    const li=(a,n)=>a.slice(0,n).map(i=>`<li>${i.msg}</li>`).join('')+(a.length>n?`<li>…y ${a.length-n} más</li>`:'');
    if(er.length){msg.className='cmsg bad';msg.innerHTML=`<b>${er.length} error(es): no se puede usar así.</b><ul>${li(er,8)}</ul>`;return}
    pending=r.data;ok.disabled=false;msg.className='cmsg good';
    msg.innerHTML=`<b>Listo:</b> ${esc(r.data.nombre||'Set sin nombre')} · ${r.data.facciones.length} facciones · ${r.data.monstruos.length} monstruos · ${r.data.acciones.length} Acciones y Reacciones.${wa.length?`<br>${wa.length} aviso(s):<ul>${li(wa,6)}</ul>`:''}`};
   ta.addEventListener('input',check);
   box.querySelector('#cfile').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>12e6){msg.className='cmsg bad';msg.textContent='El archivo pesa más de 12 MB.';return}
    const rd=new FileReader();rd.onload=()=>{ta.value=String(rd.result);check()};rd.onerror=()=>{msg.className='cmsg bad';msg.textContent='No se pudo leer el archivo.'};rd.readAsText(f)})}});
  if(v==='apply'&&pending){const saved=useCards(pending,true);renderMenu();
   await modal(`<h3>Set cargado</h3><p><b>${FAC.setName}</b> está listo para jugar.${saved?'':'<br><span class="mut">Este navegador no pudo guardarlo: al cerrar la página tendrás que importarlo de nuevo.</span>'}</p><div class="mbtns"><button class="pri" data-m="x">Aceptar</button></div>`)}
  else if(v==='reset'){useCards(DEFAULT_DATA,false);renderMenu();again=true}}}

bootCards();
</script>
</body></html>
